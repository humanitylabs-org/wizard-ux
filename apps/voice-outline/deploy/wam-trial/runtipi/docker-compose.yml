services:
  outline-streaming-demo:
    image: caddy:2.10.2-alpine
    # Copy drops the stock binary's unnecessary file capability; keep cap_drop ALL.
    command: ["/bin/sh", "-ec", "cp /usr/bin/caddy /tmp/caddy; exec /tmp/caddy reverse-proxy --from http://:8799 --to \"$${OUTLINE_TRIAL_UPSTREAM}\""]
    environment:
      OUTLINE_TRIAL_UPSTREAM: ${OUTLINE_TRIAL_UPSTREAM}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp, /config, /data]
    ports: ["127.0.0.1:${APP_PORT}:8799"]
    x-runtipi:
      is_main: true
      internal_port: 8799
x-runtipi:
  schema_version: 2
  overrides: []
