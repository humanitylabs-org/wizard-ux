services:
  outline-streaming-demo:
    image: haproxy:3.0-alpine
    command: ["/bin/sh", "-ec", "printf 'global\\n  maxconn 128\\ndefaults\\n  mode tcp\\n  timeout connect 5s\\n  timeout client 610s\\n  timeout server 610s\\nfrontend trial\\n  bind :8799\\n  default_backend upstream\\nbackend upstream\\n  server local %s check\\n' \"$${OUTLINE_TRIAL_UPSTREAM}\" > /tmp/haproxy.cfg; exec haproxy -db -f /tmp/haproxy.cfg"]
    environment:
      OUTLINE_TRIAL_UPSTREAM: ${OUTLINE_TRIAL_UPSTREAM}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp, /config, /data]
    ports: ["127.0.0.1:${APP_PORT}:8799"]
    x-runtipi:
      is_main: true
      internal_port: 8799
x-runtipi:
  schema_version: 2
  overrides: []
