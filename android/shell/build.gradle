plugins {
    id 'com.android.application'
}

// Wizard Shell: the thin Android client. It opens the owner's Wizard web shell and adds only what a web page
// cannot do on its own: the microphone, the camera, file picking, downloads and hardware Back.
// Every feature (chats, apps, Food, Photos, the orb's look) lives on the Wizard and updates without this APK.
def wosKeystore = System.getenv('WOS_KEYSTORE')
def wosSigningReady = wosKeystore && new File(wosKeystore).isFile()

android {
    namespace 'ai.wizards.shell'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.wizards.shell'
        minSdk 28
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (wosSigningReady) {
            release {
                storeFile file(wosKeystore)
                storePassword System.getenv('WOS_STORE_PASSWORD')
                keyAlias System.getenv('WOS_KEY_ALIAS')
                keyPassword System.getenv('WOS_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
        }
        release {
            minifyEnabled false
            if (wosSigningReady) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
        disable 'SetJavaScriptEnabled', 'OldTargetApi', 'GradleDependency', 'AndroidGradlePluginVersion', 'MonochromeLauncherIcon'
    }
}

dependencies {
    // addWebMessageListener: the one exact-origin message port for optional device capabilities (no JS bridge).
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
    // org.json is an Android stub on the JVM; the real one lets the protocol and custody tests run off-device.
    testImplementation 'org.json:json:20240303'
}
