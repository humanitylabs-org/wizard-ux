<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'none'; child-src 'none'; worker-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Wizard Screen</title>
<style>
  :root { --top: 24px; --bot: 0px; --acc: #b99bff; --ink: #f4f1ff; --mut: #a79fc4; --card: rgba(18, 14, 36, .97); --line: rgba(205, 190, 255, .16); --sel: rgba(150, 120, 255, .42); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #07060f; color: var(--ink); font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
  #shot { position: fixed; inset: 0; background: #07060f center / 100% 100% no-repeat; }
  #shot::after { content: ""; position: absolute; inset: 0; background: rgba(7, 6, 15, 0); transition: background .25s; }
  body.select #shot::after { background: rgba(7, 6, 15, .2); }
  #blank { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 32px; text-align: center; color: var(--mut); }
  /* translations painted over the original text, Google Lens style */
  #paint { position: fixed; inset: 0; pointer-events: none; }
  body.orig #paint { display: none; }
  .pt { position: absolute; display: flex; align-items: center; overflow: hidden; line-height: 1.12; padding: 0 2px; border-radius: 3px; word-break: break-word; font-weight: 500; }
  .pt.on { outline: 2px solid var(--acc); outline-offset: 1px; }
  /* selection */
  #hl { position: fixed; inset: 0; pointer-events: none; }
  .hl { position: absolute; background: var(--sel); border-radius: 3px; }
  .shim { position: absolute; background: rgba(255, 255, 255, .5); border-radius: 3px; opacity: 0; animation: shim .9s ease-out forwards; }
  @keyframes shim { 0% { opacity: 0; } 35% { opacity: .55; } 100% { opacity: 0; } }
  #layer { position: fixed; inset: 0; touch-action: none; }
  .hd { position: fixed; width: 44px; height: 44px; display: none; touch-action: none; z-index: 5; }
  .hd i { position: absolute; width: 22px; height: 22px; background: var(--acc); box-shadow: 0 1px 4px rgba(0, 0, 0, .5); }
  #hA i { right: 0; top: 0; border-radius: 50% 0 50% 50%; }
  #hB i { left: 0; top: 0; border-radius: 0 50% 50% 50%; }
  /* top bar */
  #top { position: fixed; left: 0; right: 0; top: var(--top); padding: 8px 10px; display: flex; gap: 8px; align-items: center; pointer-events: none; z-index: 6; }
  #top > * { pointer-events: auto; }
  .chip { height: 36px; min-width: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 600 13.5px system-ui, sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 14px rgba(0, 0, 0, .45); white-space: nowrap; }
  .chip.x { padding: 0; width: 36px; font-size: 20px; font-weight: 400; }
  .chip.on { background: #3a2870; border-color: var(--acc); }
  .chip[hidden] { display: none; }
  #mid { flex: 1; }
  /* second row: the hint, or the language pill (Lens puts it centred under the bar) */
  #sub { position: fixed; left: 0; right: 0; top: calc(var(--top) + 54px); display: flex; justify-content: center; pointer-events: none; z-index: 6; padding: 0 12px; }
  #sub > * { pointer-events: auto; }
  #hint { color: #fff; font: 600 13px system-ui, sans-serif; background: rgba(18, 14, 36, .82); padding: 6px 12px; border-radius: 14px; pointer-events: none; }
  #hint:empty { display: none; }
  #pill { max-width: 100%; overflow: hidden; text-overflow: ellipsis; height: 38px; padding: 0 16px; font-size: 14px; }
  #pill b { font-weight: 700; color: var(--acc); }
  /* bottom sheet */
  .sheet { position: fixed; left: 8px; right: 8px; bottom: calc(var(--bot) + 8px); background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 10px 34px rgba(0, 0, 0, .6); padding: 12px 12px 10px; transform: translateY(140%); transition: transform .2s cubic-bezier(.2, .8, .2, 1); z-index: 7; }
  .sheet.show { transform: none; }
  #sel { max-height: 30vh; overflow: auto; white-space: pre-wrap; word-break: break-word; font-size: 15px; color: var(--ink); user-select: text; -webkit-user-select: text; padding: 2px 2px 10px; }
  #sel .lab { display: block; font: 600 11.5px system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase; color: var(--acc); margin-bottom: 4px; user-select: none; }
  #sel .err { color: #ff9db3; }
  #sel .pl { display: block; padding: 7px 8px; margin: 2px -4px; border-radius: 10px; border: 1px solid transparent; }
  #sel .pl.on { background: rgba(185, 155, 255, .2); border-color: rgba(185, 155, 255, .55); }
  .acts { display: flex; gap: 6px; }
  .acts button { flex: 1; height: 46px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); color: var(--ink); font: 600 13px system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .acts button i { font-style: normal; font-size: 17px; line-height: 1; color: var(--acc); }
  .acts button:active { background: rgba(185, 155, 255, .18); }
  .acts button[disabled] { opacity: .45; }
  #tbar { padding: 8px; }
  #langs { max-height: 60vh; display: flex; flex-direction: column; }
  #langs h4 { margin: 2px 4px 8px; font: 600 12px system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase; color: var(--acc); }
  #langs .ll { overflow: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #langs button { height: 42px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); color: var(--ink); font: 600 14px system-ui, sans-serif; }
  #langs button.on { background: #3a2870; border-color: var(--acc); }
  /* search strip above the native search sheet */
  #sstrip { position: fixed; left: 8px; right: 8px; display: none; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; z-index: 8; }
  #sstrip b { flex: 1; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #toast { position: fixed; left: 50%; top: calc(var(--top) + 60px); transform: translate(-50%, -10px); opacity: 0; background: #241a48; border: 1px solid var(--acc); color: #fff; padding: 9px 16px; border-radius: 20px; font: 600 13.5px system-ui, sans-serif; transition: opacity .15s, transform .15s; pointer-events: none; white-space: nowrap; z-index: 9; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  .spin { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(185, 155, 255, .35); border-top-color: var(--acc); border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="shot"></div>
<div id="blank"></div>
<div id="paint"></div>
<div id="hl"></div>
<div id="layer"></div>
<div class="hd" id="hA"><i></i></div>
<div class="hd" id="hB"><i></i></div>
<div id="top">
  <button class="chip x" id="close" aria-label="Close">×</button>
  <div id="mid"></div>
  <button class="chip" id="orig" hidden>Original</button>
  <button class="chip" id="pic" hidden>Picture text</button>
  <button class="chip" id="all">Select all</button>
</div>
<div id="sub"><div id="hint"></div><button class="chip" id="pill" hidden></button></div>
<div class="sheet" id="sheet">
  <div id="sel"></div>
  <div class="acts">
    <button id="aCopy"><i>⧉</i>Copy</button>
    <button id="aSearch"><i>⌕</i>Search</button>
    <button id="aTrans"><i>文A</i>Translate</button>
    <button id="aAsk"><i>✦</i>Ask Wizard</button>
  </div>
</div>
<div class="sheet" id="tbar">
  <div class="acts">
    <button id="tCopy"><i>⧉</i>Copy translation</button>
    <button id="tSel"><i>⌶</i>Select text</button>
    <button id="tAsk"><i>✦</i>Ask Wizard</button>
  </div>
</div>
<div class="sheet" id="langs"><h4>Translate into</h4><div class="ll"></div></div>
<div id="sstrip"><b id="sq"></b><button class="chip" id="sBig">Bigger</button><button class="chip x" id="sClose" aria-label="Close search">×</button></div>
<div id="toast"></div>
<script src="screen.js"></script>
</body>
</html>
