<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'none'; child-src 'none'; worker-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Wizard</title>
<link rel="stylesheet" href="../motion/wizard-motion.css">
<style>
  :root{--wm-bottom:150px}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#000;color:#f3efff;overflow:hidden;font-family:system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none}
  #c{position:absolute;inset:0;width:100%;height:100%}
  #words{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #lock{position:absolute;top:calc(env(safe-area-inset-top) + 18px);left:0;right:0;text-align:center;
    font:600 11px/1 system-ui;letter-spacing:.2em;color:#7d74a3;text-transform:uppercase}
  #top{position:absolute;top:13%;left:0;right:0;text-align:center;font:500 12px/1 system-ui;letter-spacing:.24em;
    color:#b99bff;text-transform:uppercase;opacity:0;transition:opacity .5s}
  #top.on{opacity:1}
  #orbHit{position:absolute;left:50%;top:40%;width:150px;height:150px;transform:translate(-50%,-50%);border-radius:50%}
  /* The Wizard orb: the same WebGL orb as the app dock and the floating orb (orb.js). */
  #orbBox{position:absolute;left:50%;top:40%;width:300px;height:300px;margin:-150px 0 0 -150px;pointer-events:none}
  #orbBox canvas,#orbBox img{-webkit-mask-image:radial-gradient(circle closest-side,#000 72%,transparent 100%);mask-image:radial-gradient(circle closest-side,#000 72%,transparent 100%)}
  #orb{position:absolute;inset:0;width:100%;height:100%}
  #orbFallback{position:absolute;inset:27%;width:46%;height:46%;border-radius:50%}
  body.corner #orbBox{left:auto;right:22px;top:50%;width:88px;height:88px;margin:-44px 0 0 0}
  body.corner #orbFallback{inset:18%;width:64%;height:64%}
  /* no backdrop blur anywhere (Android WebView can leave the canvas white) */
  .wm-card{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(20,14,40,.97)!important}
  .wm-layer.open{background:radial-gradient(130% 80% at 50% 100%,rgba(30,16,70,.55),rgba(5,3,12,.35) 65%,rgba(5,3,12,.2))}
  .wm-card.err{border-color:rgba(255,190,85,.45)!important}
  .wm-card.err .wm-k{color:#ffbe55}
  .acts{display:flex;gap:10px;justify-content:center;margin-top:16px}
  .acts button{flex:1;padding:12px 10px;border-radius:999px;border:1px solid rgba(185,168,255,.35);background:rgba(122,92,255,.16);
    color:#f3efff;font:500 14px system-ui}
  .acts button.ghost{background:none;color:#b9b0d8}
  .chip{position:absolute;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(185,168,255,.08);border:1px solid rgba(185,168,255,.25);opacity:0;pointer-events:none;
    transition:opacity .3s}
  .chip.on{opacity:1;pointer-events:auto}
  .chip svg{width:24px;height:24px}
  #cancelC{left:12%;bottom:calc(env(safe-area-inset-bottom) + 104px)}
  #pauseC{left:50%;margin-left:-28px;bottom:calc(env(safe-area-inset-bottom) + 104px)}
  #unlockC{right:12%;bottom:calc(env(safe-area-inset-bottom) + 104px)}
  #pauseC .i-play{display:none}
  body.paused #pauseC .i-play{display:block}
  body.paused #pauseC .i-pause{display:none}
  body.paused #pauseC{background:rgba(255,190,85,.16);border-color:rgba(255,190,85,.5)}
  body.paused #pauseC svg{stroke:#ffbe55}
  .chip small{position:absolute;top:62px;font:500 11px system-ui;color:#7d74a3;white-space:nowrap}
  #hint{bottom:calc(env(safe-area-inset-bottom) + 28px)}
  .wm-zoom{padding:calc(env(safe-area-inset-top) + 70px) 8% 40px}
  .zl-h{font:600 11px/1 system-ui;letter-spacing:.2em;text-transform:uppercase;color:#b99bff;margin-bottom:14px}
  .empty{color:#7d74a3;font-size:15px;padding:14px 0}

  /* ---------- CORNER: unlocked, only the orb in a small bottom-right window ---------- */
  body.corner,body.corner html{background:transparent}
  html.corner{background:transparent}
  body.corner #lock,body.corner #top,body.corner #unlockC,body.corner #hint,body.corner #words,body.corner #layer,body.corner #zl{display:none!important}
  body.corner #orbHit{left:auto;right:0;top:0;width:132px;height:100%;transform:none;border-radius:0}
  /* Corner (unlocked) while talking: Cancel · Pause to the left of the orb, like the floating orb. */
  body.corner .chip{width:46px;height:46px;top:50%;bottom:auto;margin-top:-23px}
  body.corner .chip small{display:none}
  body.corner #pauseC{left:auto;right:140px;margin-left:0}
  body.corner #cancelC{left:auto;right:196px}
  /* Screen: attach what's on the phone to this take (corner/unlocked only; never on the lock screen). */
  #shotC{display:none}
  body.corner.canshot #shotC{display:flex;left:auto;right:252px}
  #shotC b{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:#b99bff;color:#140b2c;
    font:700 10px/17px system-ui;text-align:center;display:none}
  #shotC.has b{display:block}
  #shotC.flash{background:rgba(185,168,255,.32)}
  #bub{display:none;position:absolute;left:4px;right:136px;top:50%;transform:translateY(-50%) translateX(12px);opacity:0;
    padding:11px 14px;border-radius:18px;background:rgba(20,14,40,.96);border:1px solid rgba(185,168,255,.35);
    box-shadow:0 6px 28px rgba(0,0,0,.45);transition:opacity .28s,transform .28s}
  body.corner #bub{display:block}
  #bub{pointer-events:none} /* invisible bubble must never swallow taps meant for Screen/Cancel/Pause */
  #bub.on{opacity:1;transform:translateY(-50%);pointer-events:auto}
  #bub b{display:block;font:600 10px/1 system-ui;letter-spacing:.16em;text-transform:uppercase;color:#b99bff;margin-bottom:6px}
  #bub.err b{color:#ffbe55}
  #bub span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font:400 14px/1.32 system-ui;color:#f3efff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="words" class="wm-words"></canvas>
<div id="lock">🔒 locked</div>
<div id="top"></div>
<div id="orbBox"><canvas id="orb" width="300" height="300" aria-hidden="true"></canvas><img id="orbFallback" src="../robert-thread-orb.png" alt="" hidden></div>
<div id="orbHit"></div>

<div class="wm-layer" id="layer">
  <div class="wm-card" id="card">
    <div class="wm-k" id="k"></div>
    <div class="wm-m" id="m"></div>
    <div class="wm-s" id="s"></div>
    <div class="acts" id="acts"></div>
  </div>
</div>

<button class="chip" id="pauseC" aria-label="Pause"><svg viewBox="0 0 24 24" fill="none" stroke="#cfc4ff" stroke-width="1.8" stroke-linecap="round" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="#cfc4ff" stroke-width="1.8" stroke-linejoin="round" class="i-play"><path d="M7 5l12 7-12 7z"/></svg><small>pause</small></button>
<button class="chip" id="unlockC" aria-label="Unlock the phone"><svg viewBox="0 0 24 24" fill="none" stroke="#cfc4ff" stroke-width="1.6" stroke-linecap="round"><rect x="6" y="11" width="12" height="9" rx="2"/><path d="M8.5 11V8a3.5 3.5 0 0 1 6.8-1.2"/></svg><small>unlock</small></button>
<button class="chip" id="cancelC" aria-label="Cancel"><svg viewBox="0 0 24 24" fill="none" stroke="#cfc4ff" stroke-width="1.6" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg><small>cancel</small></button>

<button class="chip" id="shotC" aria-label="Attach a screenshot"><svg viewBox="0 0 24 24" fill="none" stroke="#cfc4ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><circle cx="12" cy="12" r="3"/></svg><b id="shotN"></b><small>screen</small></button>

<div class="wm-zoom" id="zl"><div class="zl-h">What you told the Wizard</div><div id="zlist"></div></div>
<div class="wm-hint" id="hint"></div>
<div id="bub"><b id="bubK"></b><span id="bubT"></span></div>

<script src="orb-size.js" data-r=".32"></script>
<script src="../orb.js"></script>
<script src="../motion/wizard-motion.js"></script>
<script src="surface.js"></script>
</body>
</html>
