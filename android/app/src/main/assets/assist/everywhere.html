<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Wizard Everywhere</title>
<style>
  /* Wizard Everywhere floating orb: the same orb (orb.js) as the in-app dock, with the take's timer on it.
     Native owns the window (exactly the orb, so taps around it reach the app below), the drag, the microphone
     and the Cancel · Pause · Screen buttons, which are their own small windows. This page only draws. */
  :root{--ink:#f3efff;--ink-3:#7d74a3;--violet-2:#b99bff;--amber:#ffbe55;--cyan:#3fe0ff;--red:#ff6b86;
    --spring:cubic-bezier(.34,1.56,.64,1)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;color:var(--ink)}
  #orbBox{position:absolute;inset:0;pointer-events:none}
  #orbBox canvas,#orbBox img{-webkit-mask-image:radial-gradient(circle closest-side,#000 72%,transparent 100%);mask-image:radial-gradient(circle closest-side,#000 72%,transparent 100%)}
  #orb{position:absolute;inset:0;width:100%;height:100%}
  #orbFallback{position:absolute;inset:18%;width:64%;height:64%;border-radius:50%}
  #mic{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;opacity:0;
    transition:opacity .25s;filter:drop-shadow(0 0 6px rgba(0,0,0,.8))}
  body.kb #mic{opacity:.92}
  body.kb.live #mic{opacity:0}
  #mic path{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #badge{position:absolute;right:4px;top:3px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;display:none;
    place-items:center;background:var(--amber);color:#1b1206;font:800 10px/1 system-ui}
  #badge.on{display:grid}
  /* The take's timer sits on the orb itself, low and small (Archimedes Anywhere's bubble timer). */
  #timer{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);padding:2px 5px;border-radius:7px;
    background:rgba(0,0,0,.62);font:700 9.5px/1 ui-monospace,monospace;letter-spacing:.02em;color:#fff;
    opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none}
  #timer::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--red);margin-right:3px;
    vertical-align:1px;animation:blink 1.1s infinite}
  body.paused #timer::before{background:var(--amber);animation:none}
  body.kb #timer::before{background:var(--cyan)}
  body.live #timer{opacity:1}
  @keyframes blink{50%{opacity:.35}}
</style>
</head>
<body>
<div id="orbBox">
  <canvas id="orb" width="64" height="64" aria-hidden="true"></canvas>
  <img id="orbFallback" src="robert-thread-orb.png" alt="" hidden>
  <svg id="mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
  <span id="badge"></span>
  <div id="timer">0:00</div>
</div>
<script>window.ORB_R = .64;</script>
<script src="orb.js"></script>
<script>
const $ = id => document.getElementById(id);
const N = window.EverywhereNative || { log(){} };
const S = { mode: 'idle', ms: 0, t0: 0, paused: false, kb: false };

function fmt(ms) { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
setInterval(() => {
  if (!document.body.classList.contains('live')) return;
  $('timer').textContent = fmt(S.ms + (S.paused ? 0 : performance.now() - S.t0));
}, 250);

/* Called by native. */
const E = window.E = {
  layout() { },
  /* mode: idle | listen | paused | think | done | type (keyboard open, idle) | typing (dictating) */
  state(o) {
    const was = S.mode;
    S.kb = !!o.kb; S.mode = o.mode || 'idle';
    const live = S.mode === 'listen' || S.mode === 'paused' || S.mode === 'typing';
    if (o.carry) { S.ms = +o.ms || 0; S.t0 = performance.now(); S.paused = S.mode === 'paused'; }   // the app's take, shown here
    else {
      if (live && !(was === 'listen' || was === 'paused' || was === 'typing')) { S.ms = 0; S.t0 = performance.now(); S.paused = false; }
      if (S.mode === 'paused' && !S.paused) { S.ms += performance.now() - S.t0; S.paused = true; }
      if (S.mode !== 'paused' && S.paused) { S.paused = false; S.t0 = performance.now(); }
    }
    document.body.classList.toggle('carry', !!o.carry);
    document.body.classList.toggle('paused', S.mode === 'paused');
    document.body.classList.toggle('kb', S.kb || S.mode === 'type' || S.mode === 'typing');
    document.body.classList.toggle('live', live);
    if (live) $('timer').textContent = fmt(S.ms + (S.paused ? 0 : performance.now() - S.t0));
    Orb.setMode(S.mode === 'typing' ? 'typing' : S.mode);
    if (!live) Orb.setLevel(0);
    const f = +o.failed || 0; $('badge').textContent = f; $('badge').classList.toggle('on', f > 0);
  },
  level(v) { Orb.setLevel(S.paused ? 0 : +v || 0); },
};
N.log('everywhere page ready webgl=' + (window.Orb && Orb.webgl));
</script>
</body>
</html>
