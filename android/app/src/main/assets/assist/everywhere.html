<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Wizard Everywhere</title>
<style>
  /* Wizard Everywhere floating orb. The same orb (orb.js) and the same arc controls as the in-app dock:
     Cancel · Pause · Screenshot fan out around the orb while you talk. Native owns the window, the drag
     and the microphone; this page only draws and reports button taps. */
  :root{--ink:#f3efff;--ink-3:#7d74a3;--violet-2:#b99bff;--amber:#ffbe55;--cyan:#3fe0ff;--red:#ff6b86;
    --spring:cubic-bezier(.34,1.56,.64,1)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;color:var(--ink)}
  #orbBox{position:absolute;width:88px;height:88px;margin:-44px 0 0 -44px;pointer-events:none}
  #orbBox canvas,#orbBox img{-webkit-mask-image:radial-gradient(circle closest-side,#000 72%,transparent 100%);mask-image:radial-gradient(circle closest-side,#000 72%,transparent 100%)}
  #orb{position:absolute;inset:0;width:100%;height:100%}
  #orbFallback{position:absolute;inset:18%;width:64%;height:64%;border-radius:50%}
  #mic{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;opacity:0;
    transition:opacity .25s;filter:drop-shadow(0 0 6px rgba(0,0,0,.8))}
  body.kb #mic{opacity:.92}
  body.kb.live #mic{opacity:0}
  #mic path{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #badge{position:absolute;right:12px;top:10px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;display:none;
    place-items:center;background:var(--amber);color:#1b1206;font:800 10.5px/1 system-ui}
  #badge.on{display:grid}
  .arc{position:absolute;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;display:grid;place-items:center;
    background:rgba(18,10,42,.86);border:1px solid rgba(205,190,255,.3);color:#fff;opacity:0;pointer-events:none;
    box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);
    transform:translate(0,0) scale(.3);transition:transform 420ms var(--spring),opacity 200ms}
  .arc svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .arc small{position:absolute;top:100%;margin-top:4px;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-3);white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.9)}
  .arc:active{background:rgba(60,40,120,.9)}
  #bCancel{color:#ffb0bf}
  #bPause .i-play{display:none}
  body.paused #bPause .i-play{display:block}
  body.paused #bPause .i-pause{display:none}
  body.paused #bPause{background:rgba(70,48,12,.9);border-color:rgba(255,190,85,.5);color:var(--amber)}
  #bShot i{position:absolute;right:-3px;top:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;display:none;
    place-items:center;background:var(--violet-2);color:#140b2c;font:800 10px/1 system-ui;font-style:normal}
  #bShot.n i{display:grid}
  body.open .arc{opacity:1;pointer-events:auto}
  body.open.kb #bShot{opacity:0;pointer-events:none}
  #timer{position:absolute;padding:4px 9px;border-radius:99px;background:rgba(18,10,42,.86);border:1px solid rgba(205,190,255,.22);
    font:700 11px/1 ui-monospace,monospace;letter-spacing:.06em;color:var(--ink);opacity:0;transition:opacity .2s;white-space:nowrap;
    transform:translate(-50%,-50%)}
  #timer::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:6px;
    vertical-align:1px;box-shadow:0 0 8px var(--red);animation:blink 1.1s infinite}
  body.paused #timer::before{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:none}
  body.kb #timer::before{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
  body.open #timer{opacity:1}
  @keyframes blink{50%{opacity:.35}}
</style>
</head>
<body>
<div id="orbBox">
  <canvas id="orb" width="88" height="88" aria-hidden="true"></canvas>
  <img id="orbFallback" src="robert-thread-orb.png" alt="" hidden>
  <svg id="mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
  <span id="badge"></span>
</div>
<button class="arc" id="bCancel" aria-label="Cancel recording"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg><small>Cancel</small></button>
<button class="arc" id="bPause" aria-label="Pause recording"><svg viewBox="0 0 24 24" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" class="i-play"><path d="M7 5l12 7-12 7z"/></svg><small>Pause</small></button>
<button class="arc" id="bShot" aria-label="Attach a screenshot"><svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg><i></i><small>Screen</small></button>
<div id="timer">0:00</div>
<script>window.ORB_R = .64;</script>
<script src="orb.js"></script>
<script>
const $ = id => document.getElementById(id);
const N = window.EverywhereNative || { cancel(){}, pause(){}, shot(){}, log(){} };
const S = { mode: 'idle', ms: 0, t0: 0, paused: false, kb: false };
let L = { ox: 44, oy: 44, dx: -1, dy: -1 };

/* Where the orb sits in this window and which way the controls fan out (towards the screen's middle). */
function place() {
  const b = $('orbBox'); b.style.left = L.ox + 'px'; b.style.top = L.oy + 'px';
  const R = 104, D = 74;   // a quarter-circle fan; labels clear the neighbouring button
  const spots = [[0, L.dy * R], [L.dx * D, L.dy * D], [L.dx * R, 0]];   // Cancel, Pause, Screenshot
  ['bCancel', 'bPause', 'bShot'].forEach((id, i) => {
    const el = $(id); el.style.left = L.ox + 'px'; el.style.top = L.oy + 'px';
    el.style.transform = document.body.classList.contains('open')
      ? `translate(${spots[i][0]}px,${spots[i][1]}px) scale(1)` : 'translate(0,0) scale(.3)';
    el.style.transitionDelay = (i * 30) + 'ms';
  });
  const t = $('timer'); t.style.left = (L.ox + L.dx * 118) + 'px'; t.style.top = (L.oy + L.dy * 118) + 'px';
}
function fmt(ms) { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
setInterval(() => {
  if (!document.body.classList.contains('open')) return;
  const ms = S.ms + (S.paused ? 0 : performance.now() - S.t0);
  $('timer').textContent = S.paused ? 'Paused · ' + fmt(ms) : fmt(ms);
}, 250);

/* Called by native. */
const E = window.E = {
  layout(o) { L = Object.assign(L, o); place(); },
  /* mode: idle | listen | paused | think | done | type (keyboard open, idle) | typing (dictating) */
  state(o) {
    const was = S.mode;
    S.kb = !!o.kb; S.mode = o.mode || 'idle';
    const live = S.mode === 'listen' || S.mode === 'paused' || S.mode === 'typing';
    if (live && !(was === 'listen' || was === 'paused' || was === 'typing')) { S.ms = 0; S.t0 = performance.now(); }
    if (S.mode === 'paused' && !S.paused) { S.ms += performance.now() - S.t0; S.paused = true; }
    if (S.mode !== 'paused' && S.paused) { S.paused = false; S.t0 = performance.now(); }
    document.body.classList.toggle('open', live && !!o.expanded);
    document.body.classList.toggle('paused', S.mode === 'paused');
    document.body.classList.toggle('kb', S.kb || S.mode === 'type' || S.mode === 'typing');
    document.body.classList.toggle('live', live);
    Orb.setMode(S.mode === 'typing' ? 'typing' : S.mode);
    if (!live) Orb.setLevel(0);
    const f = +o.failed || 0; $('badge').textContent = f; $('badge').classList.toggle('on', f > 0);
    const n = +o.shots || 0; $('bShot').querySelector('i').textContent = n; $('bShot').classList.toggle('n', n > 0);
    $('bShot').setAttribute('aria-label', n ? n + ' screenshots attached' : 'Attach a screenshot');
    place();
  },
  level(v) { Orb.setLevel(S.paused ? 0 : +v || 0); },
};
$('bCancel').addEventListener('click', e => { e.stopPropagation(); N.cancel(); });
$('bPause').addEventListener('click', e => { e.stopPropagation(); N.pause(); });
$('bShot').addEventListener('click', e => { e.stopPropagation(); N.shot(); });
place();
N.log('everywhere page ready webgl=' + (window.Orb && Orb.webgl));
</script>
</body>
</html>
