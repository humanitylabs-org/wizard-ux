plugins {
    id 'com.android.application'
}

// Release signing comes from the worker's private signing env (Thales: ~/.hermes/secure/wizard-os/signing.env).
// Nothing secret lives in this repo; without the env a release build is left unsigned and the audit rejects it.
def wosKeystore = System.getenv('WOS_KEYSTORE')
def wosSigningReady = wosKeystore && new File(wosKeystore).isFile()

// Owner defaults are private build configuration (Gradle property `wizardOrigin` or WIZARD_ORIGIN /
// WIZARD_DEFAULT_ORIGIN in the worker environment), never source. With none, the APK opens Connect:
// the owner scans Setup's QR code or pastes their Wizard's HTTPS address at first launch.
def configuredOrigin = providers.gradleProperty('wizardOrigin')
        .orElse(providers.environmentVariable('WIZARD_ORIGIN'))
        .orElse(providers.environmentVariable('WIZARD_DEFAULT_ORIGIN')).getOrElse('').trim()
def defaultOrigin = configuredOrigin ? configuredOrigin.replaceAll('/+$', '') : ''
def originUri = null
if (defaultOrigin) {
    try {
        originUri = new URI(defaultOrigin)
    } catch (Exception ignored) {
        throw new GradleException('wizardOrigin / WIZARD_ORIGIN must be an HTTPS origin (for example https://wizard.example.ts.net)')
    }
    // The native trust policy pins HTTPS port 443; paths, credentials and custom ports are not supported.
    if (originUri.scheme != 'https' || !originUri.host || originUri.port != -1 ||
            originUri.rawUserInfo != null || originUri.rawQuery != null || originUri.rawFragment != null ||
            (originUri.rawPath && originUri.rawPath != '')) {
        throw new GradleException('wizardOrigin / WIZARD_ORIGIN must be an HTTPS origin without a path, credentials or port')
    }
}
def photosServer = providers.gradleProperty('photosServer')
        .orElse(providers.environmentVariable('WIZARD_PHOTOS_SERVER')).getOrElse('').trim()
def javaString = { String value -> groovy.json.JsonOutput.toJson(value) }
def deepLinkHost = (project.findProperty('wizardDeepLinkHost') ?: (originUri ? originUri.host : 'unconfigured.invalid')).toString()

android {
    namespace 'ai.wizards.os'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.wizards.os'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        minSdk 28
        targetSdk 35
        versionCode 71
        versionName '0.10.7'
        // Empty default leaves backup unconfigured; the native Photos screen can connect a server.
        buildConfigField 'String', 'PHOTOS_SERVER', javaString(photosServer)
        buildConfigField 'String', 'HOME_URL', javaString(defaultOrigin ? defaultOrigin + '/wizard-os-home/' : '')
        buildConfigField 'String', 'ORIGIN', javaString(defaultOrigin)
        manifestPlaceholders = [wizardDeepLinkHost: deepLinkHost]
        // The one certificate (SHA-256) an in-app update must be signed with: the Wizard OS release key.
        buildConfigField 'String', 'UPDATE_SIGNER', '"3bf74d0b597bc170761079909d3692428702ba057f753ee1ffd62da3c76ed1fd"'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (wosSigningReady) {
            release {
                storeFile file(wosKeystore)
                storePassword System.getenv('WOS_STORE_PASSWORD')
                keyAlias System.getenv('WOS_KEY_ALIAS')
                keyPassword System.getenv('WOS_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            // QA build: installs beside the real app (own id) and allows WebView inspection over adb.
            applicationIdSuffix '.qa'
            versionNameSuffix '-qa'
            // QA builds pin their own debug key at runtime (each Thales build job has its own; see Updater.pinnedSigner).
            buildConfigField 'String', 'UPDATE_SIGNER', '""'
        }
        release {
            minifyEnabled false
            if (wosSigningReady) signingConfig signingConfigs.release
        }
        // QA fixture for the in-app update test only (built with :app:assembleQanext next to assembleDebug):
        // the QA app again, same debug key, but a far higher version, so the updater has a real newer APK to verify.
        qanext {
            initWith debug
            applicationIdSuffix '.qa'
            versionNameSuffix '-qanext'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
        }
        // Second update fixture (built with :app:assembleQalater): newer again than qanext (versionCode 9100+N),
        // so the silent-update QA can publish a second update after Wizard OS installed the first one itself.
        qalater {
            initWith debug
            applicationIdSuffix '.qa'
            versionNameSuffix '-qalater'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
        textReport true
        // A WebView shell over James's private Wizard OS web app with one small native bridge.
        disable 'SetJavaScriptEnabled', 'JavascriptInterface', 'OldTargetApi', 'GradleDependency', 'AndroidGradlePluginVersion', 'MonochromeLauncherIcon'
    }
}

androidComponents {
    onVariants(selector().withBuildType('qanext')) { v ->
        v.outputs.each { it.versionCode.set(9000 + (it.versionCode.getOrElse(0) ?: 0)) }
    }
    onVariants(selector().withBuildType('qalater')) { v ->
        v.outputs.each { it.versionCode.set(9100 + (it.versionCode.getOrElse(0) ?: 0)) }
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // window.wizardMizelPort: WebViewCompat.addWebMessageListener (origin-scoped page ⇄ native port).
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.media3:media3-exoplayer:1.7.1'
    implementation 'androidx.media3:media3-session:1.7.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    // org.json is an Android stub on the JVM; the real one lets the Mizel journal/protocol tests run off-device.
    testImplementation 'org.json:json:20240303'
}
