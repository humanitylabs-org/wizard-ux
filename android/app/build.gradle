plugins {
    id 'com.android.application'
}

// Release signing comes from the worker's private signing env (Thales: ~/.hermes/secure/wizard-os/signing.env).
// Nothing secret lives in this repo; without the env a release build is left unsigned and the audit rejects it.
def wosKeystore = System.getenv('WOS_KEYSTORE')
def wosSigningReady = wosKeystore && new File(wosKeystore).isFile()

// This Wizard's address is never compiled in from source. A builder may give a default through optional Gradle
// properties, normally in their private ~/.gradle/gradle.properties (or GRADLE_USER_HOME/gradle.properties, or -P):
//   wizardOrigin=https://<machine>.<tailnet>.ts.net          the Wizard the app opens
//   wizardHomeUrl=https://<machine>.<tailnet>.ts.net/wizard-os-home/   (optional; default origin + /wizard-os-home/)
//   wizardLegacyHosts=old-name.example.com,other.example.com          (optional; older names of the same Wizard)
//   wizardQaHomeUrl=https://<preview-host>/wizard-os-home/?open=chats (optional; the 'preview' build type)
// Without them the app starts on "Connect to your Wizard" and keeps what the owner enters (device/WizardAddress).
def wizardProp = { String name -> (project.findProperty(name) ?: '').toString().trim() }
def wizardOriginOf = { String url, String name ->
    if (!url) return ''
    def m = url =~ /^(https:\/\/[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)+)(\/.*)?$/
    if (!m.matches()) throw new GradleException("${name} must be an https://host address (got an unusable value)")
    return m.group(1).toLowerCase()
}
def wizardQuote = { String s -> '"' + s.replace('\\', '\\\\').replace('"', '\\"') + '"' }
def wizardOrigin = wizardOriginOf(wizardProp('wizardOrigin'), 'wizardOrigin')
def wizardHomeUrl = wizardProp('wizardHomeUrl')
if (wizardHomeUrl) {
    if (!wizardOrigin) throw new GradleException('wizardHomeUrl needs wizardOrigin')
    if (wizardOriginOf(wizardHomeUrl, 'wizardHomeUrl') != wizardOrigin) throw new GradleException('wizardHomeUrl must be on wizardOrigin')
} else if (wizardOrigin) {
    wizardHomeUrl = wizardOrigin + '/wizard-os-home/'
}
def wizardLegacyHosts = wizardProp('wizardLegacyHosts').split(/[,\s]+/).findAll { it }.collect { h ->
    wizardOriginOf('https://' + h.replaceFirst(/^https:\/\//, '').replaceAll(/\/+$/, ''), 'wizardLegacyHosts').substring(8)
}.unique()
def wizardQaHomeUrl = wizardProp('wizardQaHomeUrl')
def wizardQaOrigin = wizardOriginOf(wizardQaHomeUrl, 'wizardQaHomeUrl')
if (!wizardOrigin) {
    // A release-key build is the owner's own phone build: it must say where its Wizard is (or opt out explicitly),
    // so a missing private property can never ship a phone update that forgets its Wizard.
    if (wosSigningReady && wizardProp('wizardAllowUnconfigured') != 'true') {
        throw new GradleException('Signed Wizard OS build without wizardOrigin: set it in the builder\'s private gradle.properties (or -PwizardAllowUnconfigured=true)')
    }
    logger.lifecycle('Wizard OS: no wizardOrigin property; this build starts on "Connect to your Wizard".')
}

android {
    namespace 'ai.wizards.os'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.wizards.os'
        minSdk 28
        targetSdk 35
        versionCode 36
        versionName '0.9.12'
        buildConfigField 'String', 'HOME_URL', wizardQuote(wizardHomeUrl)
        buildConfigField 'String', 'ORIGIN', wizardQuote(wizardOrigin)
        buildConfigField 'String', 'LEGACY_HOSTS', wizardQuote(wizardLegacyHosts.join(','))
        // Link hosts the app opens in place. Reserved .invalid names (RFC 6761) when the build has no address.
        manifestPlaceholders = [
            wizardLinkHost      : wizardOrigin ? wizardOrigin.substring(8) : 'wizard.invalid',
            wizardLegacyLinkHost: wizardLegacyHosts ? wizardLegacyHosts[0] : 'wizard-legacy.invalid',
        ]
        // The one certificate (SHA-256) an in-app update must be signed with: the Wizard OS release key.
        buildConfigField 'String', 'UPDATE_SIGNER', '"3bf74d0b597bc170761079909d3692428702ba057f753ee1ffd62da3c76ed1fd"'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (wosSigningReady) {
            release {
                storeFile file(wosKeystore)
                storePassword System.getenv('WOS_STORE_PASSWORD')
                keyAlias System.getenv('WOS_KEY_ALIAS')
                keyPassword System.getenv('WOS_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            // QA build: installs beside the real app (own id) and allows WebView inspection over adb.
            applicationIdSuffix '.qa'
            versionNameSuffix '-qa'
            // QA builds pin their own debug key at runtime (each Thales build job has its own; see Updater.pinnedSigner).
            buildConfigField 'String', 'UPDATE_SIGNER', '""'
        }
        release {
            minifyEnabled false
            if (wosSigningReady) signingConfig signingConfigs.release
        }
        preview {
            initWith release
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            resValue 'string', 'app_name', 'Wizard Preview'
            // A preview of the shell on another host (wizardQaHomeUrl); without it, the same address as release.
            if (wizardQaHomeUrl) {
                buildConfigField 'String', 'HOME_URL', wizardQuote(wizardQaHomeUrl)
                buildConfigField 'String', 'ORIGIN', wizardQuote(wizardQaOrigin)
            }
            matchingFallbacks = ['release']
        }
        // QA fixture for the in-app update test only (built with :app:assembleQanext next to assembleDebug):
        // the QA app again, same debug key, but a far higher version, so the updater has a real newer APK to verify.
        qanext {
            initWith debug
            applicationIdSuffix '.qa'
            versionNameSuffix '-qanext'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
        }
        // Second update fixture (built with :app:assembleQalater): newer again than qanext (versionCode 9100+N),
        // so the silent-update QA can publish a second update after Wizard OS installed the first one itself.
        qalater {
            initWith debug
            applicationIdSuffix '.qa'
            versionNameSuffix '-qalater'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
        textReport true
        // A WebView shell over the owner's private Wizard OS web app with one small native bridge.
        disable 'SetJavaScriptEnabled', 'JavascriptInterface', 'OldTargetApi', 'GradleDependency', 'AndroidGradlePluginVersion', 'MonochromeLauncherIcon'
    }
}

androidComponents {
    onVariants(selector().withBuildType('qanext')) { v ->
        v.outputs.each { it.versionCode.set(9000 + (it.versionCode.getOrElse(0) ?: 0)) }
    }
    onVariants(selector().withBuildType('qalater')) { v ->
        v.outputs.each { it.versionCode.set(9100 + (it.versionCode.getOrElse(0) ?: 0)) }
    }
}

dependencies {
    // window.wizardMizelPort: WebViewCompat.addWebMessageListener (origin-scoped page ⇄ native port).
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
    // org.json is an Android stub on the JVM; the real one lets the Mizel journal/protocol tests run off-device.
    testImplementation 'org.json:json:20240303'
}
