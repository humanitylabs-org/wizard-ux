# Stand-in for Tailscale Serve on a box (wizard-os#133 hostile-app check): the shell at the root, an app on its own
# path, both on ONE origin, and the owner's tailnet login added to every request, as Serve does. The log is what the
# check reads: every request as the box saw it (method, path, status, Origin, whether it carried the shell token).
log_format probe escape=json '{"m":"$request_method","u":"$request_uri","s":$status,"o":"$http_origin","t":"$http_x_wizard_shell_token","site":"$http_sec_fetch_site","mode":"$http_sec_fetch_mode","dest":"$http_sec_fetch_dest"}';
server {
  listen 8080;
  access_log /var/log/nginx/probe.log probe;
  location /hostile/ { proxy_pass http://hostile:80; proxy_set_header Tailscale-User-Login owner@example.com; }
  location / { proxy_pass http://shell:8788; proxy_set_header Host $http_host; proxy_set_header Tailscale-User-Login owner@example.com; }
}
