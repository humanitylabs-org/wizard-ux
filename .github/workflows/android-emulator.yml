name: Android emulator
# On-device smoke for every Android change: boots an API 34 x86_64 emulator (KVM), installs the debug APK and proves
# MainActivity launches, stays alive without a crash, and hands off to the native Connect screen. Debug build only:
# no signing secrets and no owner origin, so Connect ("scan Setup's QR or paste the address") is the expected result. Signed releases and physical phones stay on Thales.
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-emulator.yml', 'tools/android_emulator_smoke.sh']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-emulator.yml', 'tools/android_emulator_smoke.sh']
permissions:
  contents: read
concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -memory 3072
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            bash tools/android_emulator_smoke.sh android/app/build/outputs/apk/debug/app-debug.apk smoke-out
            cd android && ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ai.wizards.os.DeviceBridgeE2eTest
      - name: Summary
        if: always()
        run: |
          echo "### Android emulator smoke" >> "$GITHUB_STEP_SUMMARY"
          cat smoke-out/result.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no result (emulator did not finish)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-smoke
          path: |
            smoke-out
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
          retention-days: 7
