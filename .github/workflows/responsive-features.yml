name: Responsive feature contracts
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# Ubuntu hosted images already include Chromium runtime libraries and fonts.
# Install only the headless shell: --with-deps re-downloads optional fonts from
# Azure's apt mirror and can exhaust the job timeout before any QA starts.
# chromium.launch({headless: true}) uses this shell; all QA/artifact steps stay mandatory.
jobs:
  chat-rename:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --only-shell chromium
      - run: node tests/qa-chat-rename.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-rename-evidence
          path: rename-evidence/
  pane-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --only-shell chromium
      - run: node tests/qa-pane-layout.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pane-layout-evidence
          path: pane-layout-evidence/
  shared-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  tap-outside-closes:
    # Keep the runner compatible with the Playwright version exercised locally.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --only-shell chromium
      - run: node tools/qa-tap-outside-closes.cjs
      - run: node tests/qa-store-install-deeplink.cjs
  app-pane-slide:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --only-shell chromium
      - run: node tests/qa-app-pane-slide.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-pane-slide-evidence
          path: app-pane-slide-evidence/
  desktop-escape-back:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --only-shell chromium
      - run: node tests/qa-desktop-escape-back.cjs
      - run: QA_OUT=escape-back-evidence node tests/qa-desktop-boot-layout.cjs
      - run: QA_OUT=archive-flash-evidence node tests/qa-desktop-archive-flash.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-escape-back-evidence
          path: |
            escape-back-evidence/
            archive-flash-evidence/
  desktop-one-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --only-shell chromium
      - run: node tests/qa-desktop-one-app.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-one-app-evidence
          path: one-app-evidence/
  opaque-overlays:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.64.1
      - run: npx playwright install --only-shell chromium
      - run: npm run test:opaque-overlays
