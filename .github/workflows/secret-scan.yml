name: Secret scan
# Public repo: every push and PR is scanned across full history, and the current tree is checked for the owner's
# private configuration (addresses, names), which must come from runtime settings or private build properties.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
      - name: gitleaks (full history)
        run: ./gitleaks git . --config .gitleaks-history.toml --no-banner --redact -v
      - name: gitleaks (current tree, incl. private-address rule)
        run: ./gitleaks dir . --config .gitleaks.toml --no-banner --redact -v
  private-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: No private address or owner name in the tree
        run: node --test tests/no-private-config.test.mjs
      - name: QA targets come from the environment
        run: node qa-tailnet-defaults.cjs
      - name: Chat links fold only this Wizard's own names
        run: node qa-relative-links.cjs
