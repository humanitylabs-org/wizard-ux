name: Secret scan
# Public repo. The required `gitleaks` check scans the commits a change adds:
#   pull_request    -> every commit in base..head (the PR's own commits)
#   push to main    -> main's entire history
#   push elsewhere  -> commits the push adds (before..after; new branch: main..after)
# Commits that live only on other branches no longer fail unrelated PRs.
# `history-audit` still scans every branch's full history daily and on demand.
on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
env:
  GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
jobs:
  gitleaks:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          curl -sSfL "$GITLEAKS_URL" -o gitleaks.tgz
          echo "$GITLEAKS_SHA256  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: gitleaks (new commits)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_REF: ${{ github.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT" = pull_request ]; then
            git fetch --no-tags origin "$PR_HEAD" "$PR_BASE"
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ "$PUSH_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            RANGE="$PUSH_AFTER"
          elif [ "$PUSH_AFTER" = "$ZERO" ]; then
            echo "Branch deleted; nothing to scan."; exit 0
          elif [ "$PUSH_BEFORE" = "$ZERO" ] || ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null \
               || ! git merge-base --is-ancestor "$PUSH_BEFORE" "$PUSH_AFTER"; then
            # New branch or force-push: every commit not already on the default branch.
            RANGE="origin/$DEFAULT_BRANCH..$PUSH_AFTER"
          else
            RANGE="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          echo "Scanning $(git rev-list --count "$RANGE") commit(s): $RANGE"
          ./gitleaks git . --config .gitleaks.toml --no-banner --redact -v --log-opts="$RANGE"
  history-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          curl -sSfL "$GITLEAKS_URL" -o gitleaks.tgz
          echo "$GITLEAKS_SHA256  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: gitleaks (every branch, full history)
        run: |
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          ./gitleaks git . --config .gitleaks.toml --no-banner --redact -v --log-opts="--all"
