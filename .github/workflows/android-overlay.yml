name: Android overlay WebView gates
on:
  pull_request:
    paths: ['android/**', 'web/assist/**', '.github/workflows/android-overlay.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-overlay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  overlay-webview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build isolated QA app and instrumentation (no signing or publishing)
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual Android WebView feature and security fixtures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: cd android && ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ai.wizards.os.OverlayE2eTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-webview-test-reports
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
          retention-days: 7
