name: Android shell
# Wizard Shell (android/shell): the thin client. Unit tests, lint, debug + unsigned release builds, then an
# emulator run of tools/android_shell_smoke.sh (Connect, bad address, Setup link, can't-reach, restart, Back, no crash), plus
# background recording against a disposable HTTPS fixture Wizard (screen off, backgrounded, a take surviving force-stop).
on:
  pull_request:
    paths: ['android/shell/**', 'android/settings.gradle', '.github/workflows/android-shell.yml', 'tools/android_shell_smoke.sh', 'tools/android_shell_fixture.py', 'tests/fixtures/qa_mic.aac']
  push:
    branches: [main]
    paths: ['android/shell/**', 'android/settings.gradle', '.github/workflows/android-shell.yml', 'tools/android_shell_smoke.sh', 'tools/android_shell_fixture.py', 'tests/fixtures/qa_mic.aac']
permissions:
  contents: read
concurrency:
  group: android-shell-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Disposable fixture Wizard (per-run CA, trusted only by this run's debug build)
        run: |
          python3 tools/android_shell_fixture.py mint "$RUNNER_TEMP/fx-certs"
          cp "$RUNNER_TEMP/fx-certs/ca.pem" android/shell/src/debug/res/raw/qa_fixture_ca.pem
          mkdir -p "$RUNNER_TEMP/fx-out"
          nohup python3 tools/android_shell_fixture.py serve "$RUNNER_TEMP/fx-certs" "$RUNNER_TEMP/fx-out" > "$RUNNER_TEMP/fx-out/server.txt" 2>&1 &
          sleep 1; curl -sk https://127.0.0.1:8443/wizard-os-home/mode
      - name: Unit tests, lint, builds
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :shell:testDebugUnitTest :shell:lintDebug :shell:assembleDebug :shell:assembleRelease
      - name: Size
        run: |
          echo "### Wizard Shell" >> "$GITHUB_STEP_SUMMARY"
          echo "Java lines: $(find android/shell/src/main/java -name '*.java' -exec cat {} + | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "Debug APK bytes: $(stat -c %s android/shell/build/outputs/apk/debug/shell-debug.apk)" >> "$GITHUB_STEP_SUMMARY"
          echo "JS bridges: $(grep -r -c 'addJavascriptInterface' android/shell/src/main/java | awk -F: '{s+=$2} END {print s+0}')" >> "$GITHUB_STEP_SUMMARY"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -memory 3072
          script: |
            sleep 45
            FIXTURE_OUT="$RUNNER_TEMP/fx-out" QA_MIC=tests/fixtures/qa_mic.aac bash tools/android_shell_smoke.sh android/shell/build/outputs/apk/debug/shell-debug.apk shell-out
      - name: Summary
        if: always()
        run: cat shell-out/result.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-shell
          path: |
            shell-out
            android/shell/build/outputs/apk/debug/shell-debug.apk
          retention-days: 7
