name: Phone promote
# Release lanes (wizard-os#720): makes a tester build public. A merge that raises android/public-release.json
# (versionName, versionCode and the APK's sha256; code-owned by James, Jan and Miguel, so one of them approves
# the PR) turns that android-v<version> prerelease into the latest release, which is what boxes mirror. The same
# bytes, no rebuild: tools/phone_release.py promote downloads the tester build, checks it against the file, re-audits
# the APK (one signer 3bf74d0b…d1fd, no owner origin), refuses a versionCode that does not rise over the current
# public release, then flips it and reads it back.
#
# Needs no secret and no environment: the APK was signed by phone-release.yml; this only changes release flags with
# github.token. Off by default, like the tester lane: nothing happens until the repository variable
# WOS_RELEASE_LANES=on. Run workflow on main repeats a promotion that failed half way.
on:
  push:
    branches: [main]
    paths: ['android/public-release.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # The same group as phone-release.yml's main runs, so a promotion never races a tester publish.
  group: phone-release-refs/heads/main
  cancel-in-progress: false
jobs:
  promote:
    if: vars.WOS_RELEASE_LANES == 'on' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Promote the tester build named in android/public-release.json
        run: |
          set -euo pipefail
          python3 tools/phone_release.py promote --public android/public-release.json --output "$RUNNER_TEMP/promote" \
            | tee "$RUNNER_TEMP/promote.txt"
          { echo '```'; cat "$RUNNER_TEMP/promote.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
