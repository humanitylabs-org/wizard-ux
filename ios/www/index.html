<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Wizard</title>
  <!-- Bundled with the app. Shown when no Wizard is set, when the Wizard can't be reached (capacitor.config.json
       server.errorPath), for Change Wizard, and for a wizard://connect link. Talks to the native WizardShell plugin.
       Rules: addresses as in android/CONNECT.md (https origin only). A scanned code or a link only fills in the address;
       nothing connects until the owner taps Connect, and nothing is saved until the address opens a Wizard, so a failed
       attempt keeps the current one. -->
  <style>
    /* Android's connect screens, drawn in HTML so both apps look the same (Jan, 30 Oct 2026): ConnectActivity (the
       Connect and Change Wizard screens, in WizardLook.nebula's colours), ReachScreen (the can't-reach looks and the
       launch loader, its fixed BG/INK/VIOLET) and TailscaleGuideView (the guide, flat on the base colour). Plus iOS's
       Wizard logo row top-left on every screen but Change Wizard. Keep the values in step with those files. */
    :root {
      --bg: #05030c; --ink: #f3efff; --ink-2: #b9b0d8; --ink-3: #7d74a3;
      --line: rgba(205, 190, 255, .13); --line-2: rgba(205, 190, 255, .24);
      --ac: #b99bff; --onac: #05030c;
      --sf: color-mix(in srgb, #f3efff 6%, transparent); --sf2: color-mix(in srgb, #f3efff 10%, transparent);
      --acs: color-mix(in srgb, #b99bff 16%, transparent);
      /* ReachScreen */
      --r-ink: #e9e4ff; --r-violet: #9b7bff; --r-button: #5b3dd6;
      --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
      --ease: cubic-bezier(.2, .9, .25, 1);
      color-scheme: dark;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); }
    body { font: 15px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink);
      -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; overflow-x: hidden; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    input { font: inherit; color: inherit; }
    [hidden] { display: none !important; }
    button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }

    /* ConnectActivity's background: the accent rising softly from the bottom into the base */
    .sky { position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: linear-gradient(to top, color-mix(in srgb, var(--ac) 16%, var(--bg)) 0%, var(--bg) 50%, var(--bg) 100%); }
    body[data-look="reach"] .sky, body[data-look="guide"] .sky { display: none; }

    main { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; width: min(480px, 100vw); margin: 0 auto;
      display: flex; flex-direction: column;
      padding: calc(var(--sat) + 12px) calc(var(--sar) + 20px) calc(var(--sab) + 24px) calc(var(--sal) + 20px); }
    /* The Wizard logo row (iOS's), top-left */
    .brand { display: flex; align-items: center; gap: 8px; color: var(--ink-3); font-size: 11px; font-weight: 600;
      letter-spacing: .22em; text-transform: uppercase; line-height: 18px; padding: 2px 4px 14px; }
    .brand img { height: 18px; width: auto; opacity: .9; }
    body[data-look="change"] main > .brand { display: none; }
    .stage { flex: 1; display: flex; flex-direction: column; }

    /* ---------- Connect / Change Wizard (ConnectActivity) ---------- */
    .card { flex: 1; display: flex; flex-direction: column; }
    .eyebrow { margin: 0; }
    #connectCard .eyebrow { display: none; }
    .head { display: flex; align-items: center; gap: 12px; }
    h1 { margin: 0 0 0 4px; font-size: 22px; font-weight: 500; line-height: 1.25; letter-spacing: 0; }
    .round { flex: none; width: 40px; height: 40px; border-radius: 99px; background: var(--sf); border: 1px solid var(--line-2);
      display: grid; place-items: center; font-size: 26px; line-height: 1; padding-bottom: 4px; color: var(--ink); }
    .head .round + h1 { margin-left: 0; }
    .orb { display: block; width: 96px; height: 96px; margin: 28px auto 8px; }
    .lead { margin: 4px 0 28px; text-align: center; color: var(--ink-2); font-size: 15px; }
    .group { display: block; margin: 0; padding: 0 4px 8px; font-size: 11px; font-weight: 600; letter-spacing: .12em;
      text-transform: uppercase; color: var(--ink-3); }
    .row { display: flex; align-items: center; gap: 12px; width: 100%; margin-bottom: 16px; padding: 12px; border-radius: 18px;
      background: var(--sf); border: 1px solid var(--line-2); text-align: left; transition: filter 150ms var(--ease); }
    .row:active { filter: brightness(1.25); }
    .tile { flex: none; width: 34px; height: 34px; border-radius: 12px; background: var(--acs); color: var(--ac);
      display: grid; place-items: center; font-size: 17px; }
    .row .tx { flex: 1; min-width: 0; margin-right: 8px; }
    .row b { display: block; font-weight: 500; font-size: 15px; }
    .row small { display: block; margin-top: 2px; color: var(--ink-3); font-size: 12.5px; line-height: 1.3; }
    .chev { flex: none; color: var(--ink-3); font-size: 22px; line-height: 1; }
    input { display: block; width: 100%; height: 52px; padding: 0 14px; border-radius: 14px; background: var(--sf);
      border: 1px solid var(--line-2); color: var(--ink); font-size: 16px; outline: none; }
    input::placeholder { color: var(--ink-3); }
    input:focus { border-color: color-mix(in srgb, var(--ac) 60%, transparent); }
    /* The status line; a problem gets the 2px accent rule on the left (.sc-error) */
    .status:empty, .err:empty { display: none; }
    .status, .err { margin-top: 10px; padding: 0 4px; font-size: 13px; line-height: 1.35; color: var(--ink-2); }
    .err { color: var(--ink); border-left: 2px solid var(--ac); padding-left: 10px; }
    .spacer { flex: 1; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; margin-top: 24px;
      padding: 0 16px; border-radius: 16px; font-size: 16px; font-weight: 500; background: var(--ac); color: var(--onac);
      transition: filter 150ms var(--ease); }
    .btn:active { filter: brightness(1.12); }
    .btn:disabled, .row:disabled, .quiet:disabled, .round:disabled { opacity: .5; }
    .quiet { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 48px; margin-top: 4px;
      color: var(--ink-2); font-size: 15px; font-weight: 500; }
    #settings { min-height: 40px; margin-top: 6px; justify-content: flex-start; padding: 0 4px; color: var(--ac); }
    .note { margin: 8px 0 0; padding: 0 4px; text-align: center; color: var(--ink-3); font-size: 12px; line-height: 1.35; }
    .meta { margin: 6px 0 0; text-align: center; font-size: 11px; color: var(--ink-3); opacity: .8; }
    .meta:empty { display: none; }
    .reach-only { display: none; }

    /* ---------- Can't reach (ReachScreen): a centred column on the base colour ---------- */
    body[data-look="reach"] main { padding: var(--sat) calc(var(--sar) + 32px) var(--sab) calc(var(--sal) + 32px); }
    body[data-look="reach"] main > .brand { position: absolute; top: calc(var(--sat) + 12px); left: calc(var(--sal) + 20px); }
    body[data-look="reach"] .card { justify-content: center; align-items: center; text-align: center; color: var(--r-ink); }
    body[data-look="reach"] .card > * { display: none; }
    body[data-look="reach"] .card > .glyph { display: block; order: 0; }
    body[data-look="reach"] .card > .head { display: block; order: 1; margin-top: 12px; }
    body[data-look="reach"] h1 { margin: 0; color: var(--r-ink); }
    body[data-look="reach"] .card > .lead { display: block; order: 2; margin: 10px 0 0; color: var(--r-ink); opacity: .78; font-size: 16px; line-height: 1.35; }
    body[data-look="reach"] .card > #retry:not([hidden]) { display: flex; order: 3; }
    body[data-look="reach"] .card > #openTs:not([hidden]) { display: flex; order: 4; }
    body[data-look="reach"] .card > .status:not(:empty) { display: block; order: 5; margin-top: 18px; padding: 0; border: 0;
      color: var(--r-ink); opacity: .55; font-size: 13px; }
    body[data-look="reach"] .card > .err:not(:empty) { display: block; order: 6; margin-top: 6px; padding: 0; border: 0;
      color: var(--r-ink); opacity: .35; font-size: 12px; }
    body[data-look="reach"] .card > #edit { display: block; order: 7; }
    .glyph { color: var(--r-violet); font-size: 48px; line-height: 1.2; }
    /* ReachScreen.pill: Try again filled, Open Tailscale outlined */
    body[data-look="reach"] #retry, #openTs { width: auto; min-width: 200px; min-height: 0; margin: 26px auto 0; padding: 13px 24px;
      border-radius: 999px; background: var(--r-button); color: #fff; font-size: 16px; font-weight: 500; line-height: 1.3; }
    #openTs { margin-top: 12px; background: transparent; border: 1px solid rgba(155, 123, 255, .43); }
    .server { margin-top: 28px; padding: 10px 16px; color: var(--r-ink); opacity: .55; font-size: 13px; word-break: break-all; }

    /* ---------- Loader (ReachScreen's connecting look): the launch cover and while connecting ---------- */
    .loader { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: var(--sat) 32px var(--sab); background: var(--bg); text-align: center; animation: fade 200ms var(--ease); }
    .loader .brand { position: absolute; top: calc(var(--sat) + 12px); left: calc(var(--sal) + 20px); }
    .loader p { margin: 18px 0 0; max-width: 300px; color: var(--r-ink); opacity: .55; font-size: 13px; }
    .loader small { display: block; margin-top: 6px; font-size: 12px; opacity: .65; word-break: break-all; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fade { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .loader { animation: none; } }

    /* ---------- Tailscale guide (tailscale-guide.js; TailscaleGuideView): full screen, flat ---------- */
    #guide { display: flex; flex-direction: column; gap: 14px; padding: 0 2px; }
    #guide .eyebrow { margin: 8px 0 0; color: var(--ac); font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
    #guide h1 { margin: -6px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
    #guide .lead { margin: -6px 0 0; text-align: left; color: var(--ink-2); font-size: 15px; }
    #guide .btn { min-height: 48px; margin-top: 10px; border-radius: 14px; font-size: 15px; font-weight: 600; }
    #guide .btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    #guide .link { align-self: flex-start; color: var(--ac); font-size: 15px; padding: 6px 2px; }
    .pill { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 12px; font-size: 14px; color: var(--ink);
      background: color-mix(in srgb, #f2b56b 14%, transparent); }
    .pill .dot { flex: none; width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: #f2b56b; }
    .steps { display: flex; flex-direction: column; }
    .step { display: grid; grid-template-columns: 32px minmax(0, 1fr); column-gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
    .step:first-child { border-top: 0; padding-top: 4px; }
    .step .gl { width: 32px; height: 32px; border-radius: 11px; display: grid; place-items: center; font-size: 14px; font-weight: 700; background: var(--sf2); color: var(--ink-2); }
    .step.now .gl { background: var(--ac); color: var(--onac); }
    .step.done .gl { background: color-mix(in srgb, #5fd39a 20%, transparent); color: #5fd39a; }
    .step.todo { opacity: .62; }
    .step.checking .gl i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--ac) 25%, transparent);
      border-top-color: var(--ac); animation: spin 1s linear infinite; }
    .step h2 { margin: 5px 0 3px; font-size: 16px; font-weight: 650; line-height: 1.3; }
    .step p { margin: 0 0 4px; color: var(--ink-2); font-size: 14.5px; line-height: 1.4; }
    .step p b { color: var(--ink); }
    .step p.warn { color: var(--ink); border-left: 2px solid #f2b56b; padding-left: 9px; margin-top: 6px; }
    .step p.hint { margin-top: 8px; font-size: 13px; color: var(--ink-3); }
    .tsmark { fill: currentColor !important; stroke: none !important; width: 18px !important; height: 18px !important; }
    .chip { display: inline-flex; margin-top: 8px; padding: 6px 10px; border-radius: 10px; background: var(--sf2); font: 500 13px ui-monospace, "SF Mono", monospace; color: var(--ink); }
    #guide details { border-top: 1px solid var(--line); padding-top: 12px; }
    #guide summary { color: var(--ac); font-size: 15px; cursor: pointer; list-style: none; }
    #guide summary::-webkit-details-marker { display: none; }
    #guide details p { margin: 10px 0 0; color: var(--ink-2); font-size: 14.5px; line-height: 1.4; }
    #guide details p b { color: var(--ink); }
    #guide .foot { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
    #guide .foot .link { padding: 4px 2px; }
    #guide .addr { color: var(--ink-3); font: 12px ui-monospace, monospace; word-break: break-all; }
    .stage.guiding { justify-content: flex-start; }
  </style>
</head>
<body data-look="connect">
  <div class="sky" aria-hidden="true"></div>
  <main>
    <div class="brand"><img src="brand/wizard-mark-white.png" alt="">Wizard</div>
    <div class="stage">
      <section class="card" id="connectCard">
        <p class="eyebrow" id="eyebrow">Connect</p>
        <div class="glyph reach-only" aria-hidden="true">◉</div>
        <div class="head">
          <button id="backTop" type="button" class="round" aria-label="Keep current Wizard" hidden>‹</button>
          <h1 id="title">Connect to your Wizard</h1>
        </div>
        <img class="orb" src="brand/orb.png" alt="">
        <p class="lead" id="lead">Link this phone to your Wizard.</p>
        <p class="group">Scan</p>
        <button id="scan" type="button" class="row">
          <span class="tile" aria-hidden="true">▦</span>
          <span class="tx"><b>Scan QR code</b><small>On your computer, open Wizard › Settings › Phones &amp; devices</small></span>
          <span class="chev" aria-hidden="true">›</span>
        </button>
        <label class="group" for="address">Or enter its address</label>
        <form id="form" novalidate>
          <input id="address" type="text" inputmode="url" autocomplete="url" autocapitalize="none" autocorrect="off" spellcheck="false"
                 placeholder="https://your-wizard.ts.net" enterkeyhint="go">
        </form>
        <div class="status" id="status" role="status"></div>
        <div class="err" id="err" role="alert"></div>
        <button id="settings" type="button" class="quiet" hidden>Open Settings to allow the camera</button>
        <div class="spacer"></div>
        <button id="connect" type="submit" form="form" class="btn">Connect</button>
        <button id="retry" type="button" class="quiet" hidden>Try again</button>
        <button id="openTs" type="button" class="quiet reach-only" hidden>Open Tailscale</button>
        <button id="back" type="button" class="quiet" hidden>Keep current Wizard</button>
        <button id="edit" type="button" class="server reach-only" aria-label="Edit Wizard address">Edit address</button>
        <p class="note">A QR code only fills in the address. Your Wizard still asks you to sign in.</p>
        <p class="meta" id="meta"></p>
      </section>
      <section id="guide" aria-live="polite" hidden></section>
    </div>
  </main>
  <div class="loader" id="loader" role="status" aria-live="polite" hidden>
    <div class="brand" aria-hidden="true"><img src="brand/wizard-mark-white.png" alt="">Wizard</div>
    <div class="glyph" aria-hidden="true">◉</div><p id="loaderText"></p>
  </div>
  <script src="tailscale-guide.js"></script>
  <script>
    (async () => {
      const $ = id => document.getElementById(id);
      // #loading=<host>: only the full-screen loader. The app lays this page over its web view at launch while the
      // saved Wizard opens (WizardViewController.showLoadingCover), so there is never a black screen. No bridge here.
      const loading = new URLSearchParams(location.hash.slice(1)).get('loading');
      if (loading !== null) {
        document.querySelector('main').setAttribute('aria-hidden', 'true');
        document.querySelector('.stage').hidden = true;
        document.body.dataset.look = 'reach';
        $('loaderText').textContent = 'Connecting to your Wizard…';
        if (loading) { const d = document.createElement('small'); d.textContent = loading; $('loaderText').append(d); }
        $('loader').hidden = false;
        return;
      }
      // Call the native plugin through the bridge Capacitor always injects (no @capacitor/core needed on this page).
      const C = window.Capacitor;
      if (!C || typeof C.nativePromise !== 'function') { $('err').textContent = 'This page only works inside the Wizard app.'; return; }
      const call = (method, options) => C.nativePromise('WizardShell', method, options || {});
      const message = (e, fallback) => (e && e.message) || fallback;
      const info = await call('info').catch(() => ({}));
      const hasWizard = !!info.address;
      // The field shows a full address, like Android's (hosts come as host[:port]).
      const full = host => /^https:\/\//i.test(host) ? host : 'https://' + host;
      // Which screen the page draws (CSS): the Connect screen, Change Wizard, a can't-reach look or the guide.
      const paintLook = () => { document.body.dataset.look = guide ? 'guide' : reach ? 'reach' : info.changing ? 'change' : 'connect'; };
      let busy = false;
      const setBusy = (on, text) => {
        busy = on;
        ['scan', 'connect', 'retry', 'back', 'backTop', 'openTs', 'edit'].forEach(id => { $(id).disabled = on; });
        $('status').textContent = '';
        // With a message: the full-screen loader. Without (leaving Change Wizard): just stop input.
        $('loader').hidden = !(on && text);
        if (on && text) {
          const [title, detail] = Array.isArray(text) ? text : [text, ''];
          $('loaderText').textContent = title;
          if (detail) { const d = document.createElement('small'); d.textContent = detail; $('loaderText').append(d); }
        }
        document.querySelector('main').setAttribute('aria-hidden', on && text ? 'true' : 'false');
        if (on) $('err').textContent = '';
      };
      const fail = text => { setBusy(false); $('err').textContent = text; };

      // Check the address opens a Wizard; native saves it and opens it. Nothing changes on failure.
      const connect = async (address, host) => {
        if (busy) return;
        // No network at all: say so, and connect by itself once it's back (the owner already tapped Connect).
        if (!(await networkOn())) { showReach('offline', address, host || address, false); return; }
        hideReach();
        // A Tailscale address while Tailscale is off can't work: show the guide now instead of waiting out the check.
        if (G.applies(host || address) && !(await tailscaleOn())) { showGuide(address, host || address, false); return; }
        setBusy(true, ['Connecting to your Wizard…', host || address]);
        try { await call('connect', { address }); }
        catch (e) {
          if (e && e.code === 'offline' && !(await networkOn())) { setBusy(false); showReach('offline', address, host || address, false); }
          else if (e && e.code === 'offline' && G.applies(host || address)) { setBusy(false); showGuide(address, host || address, false); }
          else fail(message(e, "That address didn't work."));
        }
      };

      /* ---------- Can't reach a Wizard on Tailscale: the step-by-step guide (tailscale-guide.js) ----------
       * Checks again every few seconds while it's on screen and the moment the owner comes back to the app (from
       * Tailscale or the App Store), then opens the Wizard by itself. Nothing is saved until the Wizard answers. */
      const G = window.WizardTailscaleGuide;
      const tailscaleOn = () => call('tailscale').then(r => !!(r && r.on), () => false);
      let guide = null, guideTimer = 0;
      // missing: the last check found no such name from this phone (another Tailscale network) rather than no answer.
      const paintGuide = (on, missing = guide && guide.missing) => {
        if (!guide) return;
        const key = `${on}|${missing}`;
        if (guide.key === key) return;
        const open = $('guide').querySelector('details')?.open;
        guide.key = key; guide.on = on; guide.missing = missing;
        $('guide').innerHTML = G.html({ host: guide.host, on, missing: on ? missing : null, installed: null, platform: 'ios' });
        if (open) $('guide').querySelector('details').open = true;
      };
      const showGuide = async (address, host, saved) => {
        hideReach();
        guide = { address, host, saved, on: undefined, missing: null, key: '' };
        $('connectCard').hidden = true; $('guide').hidden = false; document.querySelector('.stage').classList.add('guiding');
        paintLook();
        paintGuide(await tailscaleOn());
        scrollTo(0, 0);
        clearTimeout(guideTimer); guideTimer = setTimeout(guideTick, 1500);
      };
      const hideGuide = () => {
        guide = null; clearTimeout(guideTimer);
        $('guide').hidden = true; $('connectCard').hidden = false; document.querySelector('.stage').classList.remove('guiding');
        paintLook();
      };
      async function guideTick() {
        clearTimeout(guideTimer);
        // Busy is per guide: a check still running for a guide the owner left must not stop the new one's ticks.
        if (!guide || guide.busy) return;
        if (document.visibilityState !== 'visible') return; // resumes on visibilitychange
        const g = guide;
        g.busy = true;
        try {
          // No network at all: the guide can't help; the plain offline look waits for it.
          if (!(await networkOn())) { if (guide === g) showReach('offline', g.address, g.host, g.saved); return; }
          const on = await tailscaleOn();
          // A reason found while Tailscale was off (no ts.net name resolves then) says nothing once it's on.
          if (g.on !== undefined && on !== g.on) { g.missing = null; g.notFound = 0; }
          paintGuide(on);
          const r = await call('check', { address: g.address }).catch(() => ({}));
          if (guide !== g) return;
          // Only an answer found with Tailscale on the whole time counts. "Not on your network" needs two in a row:
          // right after Tailscale connects the name can briefly fail to resolve.
          if (r && r.offline && on && (await tailscaleOn())) {
            g.notFound = r.missing ? (g.notFound || 0) + 1 : 0;
            if (!r.missing) paintGuide(on, false);
            else if (g.notFound >= 2) paintGuide(on, true);
          }
          if (r && r.ok) {
            setBusy(true, ['Connected. Opening Wizard…', g.host]);
            if (g.saved) await call('retry');
            else await call('connect', { address: g.address }).catch(() => { setBusy(false); });
            return;
          }
          // Something answered, but not as this Wizard (this phone isn't allowed in, or another site): Tailscale works,
          // so the guide can't help. Say what was found.
          if (r && r.ok === false && !r.offline && r.problem) {
            if (g.saved && r.refused) showReach('refused', g.address, g.host, true);
            else { hideGuide(); $('address').value = full(g.host); fail(r.problem); }
            return;
          }
        } finally { g.busy = false; }
        if (guide === g) guideTimer = setTimeout(guideTick, 4000);
      }
      document.addEventListener('visibilitychange', () => { if (guide && document.visibilityState === 'visible') guideTick(); });
      $('guide').addEventListener('click', e => {
        const t = e.target.closest('[data-guide]'); if (!t) return;
        if (t.dataset.guide === 'tailscale') call('openTailscale');
        else if (t.dataset.guide === 'other') { hideGuide(); $('scan').focus(); }
      });

      /* ---------- No network, or the saved Wizard can't be reached without the guide: the plain can't-reach look ----------
       * Android ReachPolicy's words. Tries again by itself every 15 s while on screen (RETRY_MS), once the network is
       * back (after NET_SETTLE_MS) and on return to the app; opens the Wizard as soon as it answers. */
      const REACH = {
        offline: ["You're offline", () => "This phone has no connection. Wizard opens by itself when it's back."],
        refused: ["This phone isn't allowed into this Wizard", () => "Sign in to Tailscale with your Wizard's account."],
        server: ["Can't reach your Wizard", () => "Your Wizard isn't answering yet. Check its address and connection. Wizard keeps trying by itself."],
        quiet: ["Can't reach your Wizard", () => "Your Wizard isn't answering yet. Check its address and connection. Wizard keeps trying by itself."],
      };
      const RETRY_MS = 15000, NET_POLL_MS = 2500, NET_SETTLE_MS = 700;
      // Unknown counts as on: the page never says "offline" unless the phone does.
      const networkOn = () => call('network').then(r => !(r && r.on === false), () => true);
      let reach = null, reachTimer = 0, netTimer = 0, cardWords = [];
      const showReach = (kind, address, host, saved) => {
        if (guide) hideGuide();
        if (!reach) cardWords = ['eyebrow', 'title', 'lead'].map(id => $(id).textContent);
        reach = { kind, address, host, saved };
        $('eyebrow').textContent = 'Not connected';
        $('title').textContent = REACH[kind][0];
        $('lead').textContent = REACH[kind][1](host);
        $('address').value = full(host);
        $('err').textContent = ''; $('status').textContent = '';
        // ReachScreen's quiet address line, and Open Tailscale where Tailscale can help (not for no network at all).
        $('edit').textContent = `${host}  ·  Edit address`;
        $('openTs').hidden = kind === 'offline' || !(kind === 'refused' || G.applies(host));
        paintLook();
        if (saved) { $('retry').hidden = false; $('retry').classList.add('primary'); $('scan').classList.remove('primary'); }
        clearTimeout(reachTimer); clearTimeout(netTimer);
        if (kind !== 'offline') reachTimer = setTimeout(reachTick, RETRY_MS);
        netTimer = setTimeout(netTick, NET_POLL_MS);
      };
      const hideReach = () => {
        if (!reach) return;
        reach = null; clearTimeout(reachTimer); clearTimeout(netTimer);
        ['eyebrow', 'title', 'lead'].forEach((id, i) => { $(id).textContent = cardWords[i]; });
        paintLook();
      };
      // Every NET_POLL_MS: offline → on tries at once (after the burst settles); on → off shows the offline look.
      async function netTick() {
        clearTimeout(netTimer);
        const r = reach;
        if (!r || document.visibilityState !== 'visible') return; // resumes on visibilitychange
        const on = await networkOn();
        if (reach !== r) return;
        if (r.kind === 'offline' && on) { netTimer = setTimeout(reachTick, NET_SETTLE_MS); return; }
        if (r.kind !== 'offline' && !on) { showReach('offline', r.address, r.host, r.saved); return; }
        netTimer = setTimeout(netTick, NET_POLL_MS);
      }
      async function reachTick() {
        clearTimeout(reachTimer);
        const r = reach;
        if (!r || r.busy || busy || document.visibilityState !== 'visible') return;
        r.busy = true;
        let res;
        try { res = (await call('check', { address: r.address }).catch(() => ({}))) || {}; }
        finally { r.busy = false; }
        if (reach !== r) return;
        if (res.ok) {
          setBusy(true, ['Connected. Opening Wizard…', r.host]);
          if (r.saved) call('retry');
          else call('connect', { address: r.address }).catch(e => { hideReach(); fail(message(e, "That address didn't work.")); });
          return;
        }
        if (!(await networkOn())) { if (reach === r) showReach('offline', r.address, r.host, r.saved); return; }
        if (reach !== r) return;
        // Nothing answered a Tailscale address: the guide walks through Tailscale (and connects by itself).
        if (res.offline && G.applies(r.host)) { showGuide(r.address, r.host, r.saved); return; }
        const kind = res.refused ? 'refused' : r.kind !== 'offline' ? r.kind : r.saved ? (res.offline ? 'quiet' : 'server') : '';
        if (!kind) { hideReach(); fail(res.problem || "That address didn't work."); return; } // a new address: say why
        if (kind !== r.kind) showReach(kind, r.address, r.host, r.saved);
        else { reachTimer = setTimeout(reachTick, RETRY_MS); clearTimeout(netTimer); netTimer = setTimeout(netTick, NET_POLL_MS); }
        // What the check found, under the words (a refusal's title already says it).
        $('err').textContent = !res.offline && !res.refused && res.problem ? res.problem : '';
      }
      document.addEventListener('visibilitychange', () => {
        if (reach && document.visibilityState === 'visible') (reach.kind === 'offline' ? netTick : reachTick)();
      });

      // A scanned code or a link only fills in the address: nothing connects until the owner taps Connect
      // (android/CONNECT.md).
      const offer = (host, note) => {
        hideReach();
        $('address').value = full(host);
        $('err').textContent = '';
        $('status').textContent = note;
        $('connect').classList.add('primary'); $('scan').classList.remove('primary');
      };

      if (info.changing) {
        $('eyebrow').textContent = 'Change Wizard';
        $('title').textContent = 'Change Wizard';
        $('lead').textContent = 'Point this phone at another Wizard, or this one again.';
        $('address').value = full(info.address);
        $('back').hidden = false; $('backTop').hidden = false;
        paintLook();
      } else if (hasWizard && info.network === false) {
        // A Wizard is set but this phone has no network: say so (not the guide); it opens once the network is back.
        showReach('offline', info.address, info.address, true);
      } else if (hasWizard && (info.problem === 'refused' || info.problem === 'server')) {
        // The Wizard answered the launch with 401/403 (this phone isn't its owner's) or 5xx (restarting): no guide.
        showReach(info.problem, info.address, info.address, true);
      } else if (hasWizard && G.applies(info.address)) {
        // A Wizard on Tailscale is set but didn't answer: walk the owner through Tailscale (the guide connects by itself).
        $('address').value = full(info.address);
        $('retry').hidden = false;
        showGuide(info.address, info.address, true);
      } else if (hasWizard) {
        // A Wizard is set but we ended up here: it didn't answer.
        showReach('quiet', info.address, info.address, true);
      }
      if (info.version) $('meta').textContent = `Wizard for iPhone ${info.version} (${info.build})`;
      if (info.pendingError) $('err').textContent = info.pendingError;
      if (info.pending) offer(info.pendingHost, 'Check the address, then tap Connect.');

      $('scan').addEventListener('click', async () => {
        if (busy) return;
        $('err').textContent = ''; $('settings').hidden = true;
        let text;
        try { text = (await call('scan')).text; }
        catch (e) {
          if (e && e.code === 'cancelled') return;
          if (e && e.code === 'denied') $('settings').hidden = false;
          $('err').textContent = message(e, "Couldn't scan.");
          return;
        }
        try { const { host } = await call('parse', { text }); offer(host, 'Scanned. Check the address, then tap Connect.'); }
        catch (e) { $('err').textContent = message(e, "That QR code isn't a Wizard address. Scan the one in Settings › Phones & devices, not the Tailscale sign-in code."); }
      });
      $('settings').addEventListener('click', () => call('openSettings'));
      $('retry').addEventListener('click', () => { setBusy(true, ['Trying again…', info.address]); call('retry'); });
      $('back').addEventListener('click', () => { setBusy(true); call('cancelChange'); });
      $('backTop').addEventListener('click', () => $('back').click());
      $('openTs').addEventListener('click', () => call('openTailscale'));
      // Edit address: back to the Connect screen with the address in the field (stops the automatic retries).
      $('edit').addEventListener('click', () => { hideReach(); $('err').textContent = ''; $('address').focus(); });
      $('form').addEventListener('submit', async e => {
        e.preventDefault();
        if (busy) return;
        try {
          const { origin, host } = await call('parse', { text: $('address').value, typed: true });
          connect(origin, host);
        } catch (err) { $('err').textContent = "Enter your Wizard's https:// address, like https://wizard.your-tailnet.ts.net"; }
      });
    })();
  </script>
</body>
</html>
