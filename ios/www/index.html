<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Wizard</title>
  <!-- Bundled with the app. Shown only when no Wizard address is set, or the Wizard can't be reached
       (capacitor.config.json server.errorPath). Talks to the native WizardShell plugin. -->
  <style>
    :root { color-scheme: dark; --bg: #05030c; --fg: #f3effa; --muted: rgba(243, 239, 250, .62); --line: rgba(243, 239, 250, .16); --accent: #b79bff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    main { min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 18px;
      padding: max(32px, env(safe-area-inset-top)) 28px max(32px, env(safe-area-inset-bottom)); max-width: 460px; margin: 0 auto; }
    h1 { font-size: 28px; line-height: 1.15; margin: 0; font-weight: 650; letter-spacing: -.01em; }
    p { margin: 0; color: var(--muted); }
    label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
    input { width: 100%; font: inherit; color: var(--fg); background: rgba(255, 255, 255, .06); border: 1px solid var(--line);
      border-radius: 12px; padding: 13px 14px; outline: none; }
    input:focus { border-color: var(--accent); }
    .row { display: flex; gap: 10px; }
    button { flex: 1; font: inherit; font-weight: 600; border-radius: 12px; padding: 13px 16px; border: 1px solid var(--line);
      background: transparent; color: var(--fg); }
    button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    button:disabled { opacity: .5; }
    .err { color: #ff9a9a; min-height: 1.4em; font-size: 15px; }
    .meta { font-size: 13px; color: rgba(243, 239, 250, .38); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Connect to your Wizard</h1>
    <p id="lead">Enter your Wizard's address.</p>
    <form id="form">
      <label for="address">Wizard address</label>
      <input id="address" type="url" inputmode="url" autocomplete="url" autocapitalize="none" autocorrect="off" spellcheck="false"
             placeholder="wizard.example.ts.net" enterkeyhint="go">
    </form>
    <div class="err" id="err" role="alert"></div>
    <div class="row">
      <button id="retry" type="button" hidden>Try again</button>
      <button id="connect" type="submit" form="form" class="primary">Connect</button>
    </div>
    <p class="meta" id="meta"></p>
  </main>
  <script>
    (async () => {
      const $ = id => document.getElementById(id);
      const shell = window.Capacitor && window.Capacitor.registerPlugin ? window.Capacitor.registerPlugin('WizardShell') : null;
      if (!shell) { $('err').textContent = 'This page only works inside the Wizard app.'; return; }
      const info = await shell.info().catch(() => ({}));
      if (info.address) {
        // An address is set but we ended up here: the Wizard didn't answer.
        $('title').textContent = "Can't reach your Wizard";
        $('lead').textContent = `${info.address} didn't answer. If your Wizard is on a private network, make sure Tailscale is on, then try again.`;
        $('address').value = info.address;
        $('retry').hidden = false;
        $('connect').textContent = 'Connect';
      }
      if (info.version) $('meta').textContent = `Wizard for iPhone ${info.version} (${info.build})`;
      $('retry').addEventListener('click', () => { $('retry').disabled = true; shell.retry(); });
      $('form').addEventListener('submit', async e => {
        e.preventDefault();
        $('err').textContent = '';
        $('connect').disabled = true;
        try { await shell.connect({ address: $('address').value }); }
        catch (err) { $('err').textContent = (err && err.message) || "That address didn't work."; $('connect').disabled = false; }
      });
    })();
  </script>
</body>
</html>
