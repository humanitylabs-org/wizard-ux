<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Wizard</title>
  <!-- Bundled with the app. Shown when no Wizard is set, when the Wizard can't be reached (capacitor.config.json
       server.errorPath), for Change Wizard, and for a wizard://connect link. Talks to the native WizardShell plugin.
       Rules: addresses as in android/CONNECT.md (https origin only). A scanned code, a link or a typed address connects
       at once, with no confirmation; nothing is saved until the address opens a Wizard, so a failed attempt keeps the
       current one. -->
  <style>
    /* Wizard's own components, bundled so this screen works with no Wizard reachable: the phone shell's tokens and
       nebula (web/core/base.css, web/styles.css) and the Setup app's rows, buttons, address field and banner
       (web/setup/setup.css). Keep in step with those files. */
    :root {
      --bg: #05030c; --ink: #f3efff; --ink-2: #b9b0d8; --ink-3: #7d74a3;
      --line: rgba(205, 190, 255, .13); --line-2: rgba(205, 190, 255, .24);
      --glass: rgba(18, 12, 38, .58); --ac: #b99bff; --onac: #05030c; --red: #ff6b86;
      --sf: color-mix(in srgb, #f3efff 6%, transparent); --sf2: color-mix(in srgb, #f3efff 10%, transparent);
      --ease: cubic-bezier(.2, .9, .25, 1);
      color-scheme: dark;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); }
    body { font: 15px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink);
      -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; overflow-x: hidden; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    input { font: inherit; color: inherit; }
    [hidden] { display: none !important; }

    /* Nebula + stars (web/styles.css .nebula) */
    .sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .nebula { position: absolute; inset: -20%; }
    .nebula i { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .5; mix-blend-mode: screen; animation: drift 26s ease-in-out infinite alternate; }
    .nebula i:nth-child(1) { width: 70%; height: 40%; left: 5%; top: 10%; background: radial-gradient(closest-side, rgba(110, 60, 255, .55), transparent); }
    .nebula i:nth-child(2) { width: 60%; height: 45%; right: -5%; top: 38%; background: radial-gradient(closest-side, rgba(255, 70, 200, .28), transparent); animation-duration: 31s; }
    .nebula i:nth-child(3) { width: 90%; height: 40%; left: 0; bottom: -2%; background: radial-gradient(closest-side, rgba(60, 120, 255, .28), transparent); animation-duration: 37s; }
    @keyframes drift { to { transform: translate3d(6%, -4%, 0) scale(1.12); } }
    .stars { position: absolute; inset: 0; opacity: .55;
      background-image: radial-gradient(1px 1px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 78% 9%, #fff, transparent),
        radial-gradient(1px 1px at 35% 62%, #fff, transparent), radial-gradient(1.5px 1.5px at 88% 44%, #fff, transparent),
        radial-gradient(1px 1px at 22% 86%, #fff, transparent), radial-gradient(1px 1px at 64% 78%, #fff, transparent),
        radial-gradient(1px 1px at 52% 30%, #fff, transparent), radial-gradient(1.5px 1.5px at 6% 52%, #fff, transparent),
        radial-gradient(1px 1px at 93% 92%, #fff, transparent), radial-gradient(1px 1px at 44% 8%, #fff, transparent); }
    @media (prefers-reduced-motion: reduce) { .nebula i { animation: none; } }

    main { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; width: min(480px, 100vw); margin: 0 auto;
      display: flex; flex-direction: column;
      padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px calc(env(safe-area-inset-bottom, 0px) + 20px); }
    .brand { display: flex; align-items: center; gap: 8px; color: var(--ink-3); font-size: 11px; font-weight: 600;
      letter-spacing: .18em; text-transform: uppercase; min-height: 44px; }
    .brand img { height: 18px; width: auto; opacity: .9; }
    .stage { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 12px 0; }

    /* Glass card: the shell's window material */
    .card { padding: 22px 18px 18px; border-radius: 22px; background: var(--glass); border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .35); display: flex; flex-direction: column; gap: 14px; }
    .eyebrow { margin: 0; color: var(--ac); font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: -6px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
    .lead { margin: -6px 0 0; color: var(--ink-2); font-size: 15px; }

    /* Setup app buttons */
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; padding: 0 16px;
      border-radius: 14px; font-size: 15px; font-weight: 600; background: var(--sf2); color: var(--ink); transition: filter 150ms var(--ease); }
    .btn.primary { background: var(--ac); color: var(--onac); }
    .btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .btn:active { filter: brightness(1.12); }
    .btn:disabled { opacity: .5; }
    .btn:focus-visible, .link:focus-visible, input:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
    .row { display: flex; gap: 10px; }
    .link { align-self: flex-start; color: var(--ac); font-size: 15px; padding: 6px 2px; }

    .or { display: flex; align-items: center; gap: 12px; color: var(--ink-3); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }

    /* Setup app address field (.url) */
    label { display: block; margin: 0 0 6px 2px; font-size: 13px; color: var(--ink-3); }
    input { width: 100%; min-height: 48px; padding: 0 14px; border-radius: 14px; background: var(--sf2); border: 1px solid transparent;
      color: var(--ink); font-size: 16px; outline: none; transition: border-color 150ms var(--ease); }
    input::placeholder { color: var(--ink-3); }
    input:focus { border-color: var(--line-2); }

    /* Setup app banner */
    .status:empty, .err:empty { display: none; }
    .status, .err { padding: 10px 12px; border-radius: 12px; background: var(--sf2); font-size: 14px; }
    .status { color: var(--ink-2); }
    .err { color: var(--ink); background: color-mix(in srgb, var(--red) 16%, transparent); }
    .meta { margin: 6px 0 0; text-align: center; font-size: 12px; color: var(--ink-3); }

    /* Full-screen loader while connecting: dims the whole screen (the Setup app's scrim + working glyph) */
    .loader { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 24px; background: color-mix(in srgb, var(--bg) 88%, transparent);
      -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); animation: fade 200ms var(--ease); }
    .loader i { width: 44px; height: 44px; border-radius: 50%; border: 3px solid color-mix(in srgb, var(--ac) 22%, transparent);
      border-top-color: var(--ac); animation: spin 900ms linear infinite; }
    .loader p { margin: 0; max-width: 300px; text-align: center; color: var(--ink); font-size: 16px; font-weight: 600; }
    .loader small { display: block; margin-top: 6px; color: var(--ink-3); font-size: 14px; font-weight: 400; word-break: break-all; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fade { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .loader, .loader i { animation-duration: 0s; } .loader i { animation: spin 2.4s linear infinite; } }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"><div class="nebula"><i></i><i></i><i></i></div><div class="stars"></div></div>
  <main>
    <div class="brand"><img src="brand/wizard-mark-white.png" alt="">Wizard</div>
    <div class="stage">
      <section class="card">
        <p class="eyebrow" id="eyebrow">Connect</p>
        <h1 id="title">Connect to your Wizard</h1>
        <p class="lead" id="lead">On your computer, open Wizard → Setup → Use Wizard on your phone, then scan the QR code it shows.</p>
        <button id="scan" type="button" class="btn primary">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 8h3v3H8zM13 13h3v3h-3zM13 8h3M8 16h3"/></svg>
          Scan QR code
        </button>
        <div class="or" id="or">or enter the address</div>
        <form id="form" novalidate>
          <label for="address">Wizard address</label>
          <input id="address" type="text" inputmode="url" autocomplete="url" autocapitalize="none" autocorrect="off" spellcheck="false"
                 placeholder="wizard.example.ts.net" enterkeyhint="go">
        </form>
        <div class="status" id="status" role="status"></div>
        <div class="err" id="err" role="alert"></div>
        <button id="settings" type="button" class="link" hidden>Open Settings to allow the camera</button>
        <div class="row">
          <button id="back" type="button" class="btn" hidden>Cancel</button>
          <button id="retry" type="button" class="btn" hidden>Try again</button>
          <button id="connect" type="submit" form="form" class="btn">Connect</button>
        </div>
      </section>
    </div>
    <p class="meta" id="meta"></p>
  </main>
  <div class="loader" id="loader" role="status" aria-live="polite" hidden><i aria-hidden="true"></i><p id="loaderText"></p></div>
  <script>
    (async () => {
      const $ = id => document.getElementById(id);
      // Call the native plugin through the bridge Capacitor always injects (no @capacitor/core needed on this page).
      const C = window.Capacitor;
      if (!C || typeof C.nativePromise !== 'function') { $('err').textContent = 'This page only works inside the Wizard app.'; return; }
      const call = (method, options) => C.nativePromise('WizardShell', method, options || {});
      const message = (e, fallback) => (e && e.message) || fallback;
      const info = await call('info').catch(() => ({}));
      const hasWizard = !!info.address;
      let busy = false;
      const setBusy = (on, text) => {
        busy = on;
        ['scan', 'connect', 'retry', 'back'].forEach(id => { $(id).disabled = on; });
        $('status').textContent = '';
        // With a message: the full-screen loader. Without (leaving Change Wizard): just stop input.
        $('loader').hidden = !(on && text);
        if (on && text) {
          const [title, detail] = Array.isArray(text) ? text : [text, ''];
          $('loaderText').textContent = title;
          if (detail) { const d = document.createElement('small'); d.textContent = detail; $('loaderText').append(d); }
        }
        document.querySelector('main').setAttribute('aria-hidden', on && text ? 'true' : 'false');
        if (on) $('err').textContent = '';
      };
      const fail = text => { setBusy(false); $('err').textContent = text; };

      // Check the address opens a Wizard; native saves it and opens it. Nothing changes on failure.
      const connect = async (address, host) => {
        if (busy) return;
        setBusy(true, ['Connecting to your Wizard…', host || address]);
        try { await call('connect', { address }); }
        catch (e) { fail(message(e, "That address didn't work.")); }
      };
      // A scanned code or a link connects at once, like a typed address.
      const offer = (origin, host) => {
        $('address').value = host;
        connect(origin, host);
      };

      if (info.changing) {
        $('eyebrow').textContent = 'Change Wizard';
        $('title').textContent = 'Change Wizard';
        $('lead').textContent = `This iPhone uses ${info.address}. Scan the other Wizard's QR code, or enter its address.`;
        $('back').hidden = false;
      } else if (hasWizard) {
        // A Wizard is set but we ended up here: it didn't answer.
        $('eyebrow').textContent = 'Not connected';
        $('title').textContent = "Can't reach your Wizard";
        $('lead').textContent = `${info.address} didn't answer. If your Wizard is on a private network, make sure Tailscale is on, then try again. Or scan another Wizard's QR code.`;
        $('address').value = info.address;
        $('retry').hidden = false;
        $('retry').classList.add('primary');
        $('scan').classList.remove('primary');
      }
      $('back').textContent = hasWizard ? `Back to ${info.address}` : 'Cancel';
      if (info.version) $('meta').textContent = `Wizard for iPhone ${info.version} (${info.build})`;
      if (info.pendingError) $('err').textContent = info.pendingError;
      if (info.pending) offer(info.pending, info.pendingHost);

      $('scan').addEventListener('click', async () => {
        if (busy) return;
        $('err').textContent = ''; $('settings').hidden = true;
        let text;
        try { text = (await call('scan')).text; }
        catch (e) {
          if (e && e.code === 'cancelled') return;
          if (e && e.code === 'denied') $('settings').hidden = false;
          $('err').textContent = message(e, "Couldn't scan.");
          return;
        }
        try { const { origin, host } = await call('parse', { text }); offer(origin, host); }
        catch (e) { $('err').textContent = message(e, "This QR code isn't a Wizard address."); }
      });
      $('settings').addEventListener('click', () => call('openSettings'));
      $('retry').addEventListener('click', () => { setBusy(true, ['Trying again…', info.address]); call('retry'); });
      $('back').addEventListener('click', () => { setBusy(true); call('cancelChange'); });
      $('form').addEventListener('submit', async e => {
        e.preventDefault();
        if (busy) return;
        try {
          const { origin, host } = await call('parse', { text: $('address').value, typed: true });
          connect(origin, host);
        } catch (err) { $('err').textContent = message(err, "That isn't an https Wizard address."); }
      });
    })();
  </script>
</body>
</html>
