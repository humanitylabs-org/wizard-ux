<!doctype html>
<html lang="en" data-app="topics">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Wizard · Topics · Sample</title>
<script src="../theme-client.js"></script>
<link rel="stylesheet" href="../ui.css">
<link rel="stylesheet" href="topics.css">
<script defer src="shared/fixture.js"></script>
<script defer src="topics.js"></script>
</head>
<body>
<header class="top">
  <div class="brand"><span class="glyph" aria-hidden="true">◇</span><h1>Topics<span id="viewName" class="sr-only"></span></h1></div>
  <div id="meta" class="meta"></div>
</header>
<main id="pager">
  <section id="v-today" class="pane" data-view="today" aria-label="Today"></section>
  <section id="v-following" class="pane" data-view="following" aria-label="Following"></section>
  <section id="v-archive" class="pane" data-view="archive" aria-label="Archive"></section>
</main>
<button id="fab" class="fab" type="button" aria-label="Follow a topic (sample only)"><span>+</span> Follow</button>
<nav class="tabs" role="tablist">
  <button role="tab" data-view="today"><b>◉</b><span>Today</span></button>
  <button role="tab" data-view="following"><b>◇</b><span>Following</span></button>
  <button role="tab" data-view="archive"><b>☰</b><span>Archive</span></button>
</nav>
<div id="scrim" class="scrim" hidden></div>
<section id="sheet" class="sheet" hidden></section>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
