     script core/pin-doc.js loads for a pinned app (kinds e, x, m), in index.html order, so WizLive, the Chats host,
     uploads, the bell, the media viewer and the rest are there for app frames. Never the phone/desktop choice
     (core/shell.js), the PWA prompt or the scripts that do nothing in a one-app session (kind s).
     tests/pin-slim-doc.test.mjs keeps this list in step with core/pin-doc.js. data-offline-copy="no" files are kept
     by the shell's own worker (sw.js) like the full shell's, not in the small pinned offline copy
