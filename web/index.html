<!doctype html>
<html lang="en" data-shell="phone">
<head>
  <meta charset="utf-8">
  <script src="core/shell.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#05030c">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Wizard OS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <script src="pwa-install.js" data-pwa-name="Wizard OS" data-pwa-origin=""></script>
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="stylesheet" href="core/base.css">
  <link rel="stylesheet" href="motion/wizard-motion.css">
  <link rel="stylesheet" href="core/chats.css">
  <link rel="stylesheet" href="core/chat-power.css">
  <link rel="stylesheet" href="core/polish.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="core/links.css">
</head>
<body>
  <div id="device" class="device">
    <canvas id="stars" class="stars" aria-hidden="true"></canvas>
    <div class="nebula" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="lean" aria-hidden="true"></div>

    <header class="statusbar" aria-hidden="true">
      <span id="clock">18:00</span>
      <span class="sb-right">
        <svg viewBox="0 0 18 12"><path d="M1 11h2V8H1zm4 0h2V6H5zm4 0h2V4H9zm4 0h2V1h-2z" fill="currentColor"/></svg>
        <svg viewBox="0 0 16 12"><path d="M8 11.5 1 4a10 10 0 0 1 14 0z" fill="currentColor"/></svg>
        <span class="batt"><i></i></span>
      </span>
    </header>

    <main id="desks" class="desks" aria-live="polite">
      <div id="track" class="track"></div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="deskLabel" class="desk-label" aria-hidden="true"></div>

    <!-- Voice layer: transcript + arc controls -->
    <div id="voice" class="voice" aria-hidden="true">
      <div id="transcript" class="transcript">
        <div class="tx-route"><b id="txRouteIcon">✦</b><span id="txRouteText">Listening…</span></div>
        <p id="txText"></p>
        <div id="txChips" class="tx-chips"></div>
      </div>
      <button id="arcCancel" class="arc arc-left" aria-label="Cancel recording"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg><small>Cancel</small></button>
      <button id="arcPause" class="arc arc-mid" aria-label="Pause recording"><svg viewBox="0 0 24 24" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" class="i-play"><path d="M7 5l12 7-12 7z"/></svg><small>Pause</small></button>
      <button id="arcAttach" class="arc arc-right" aria-label="Attach a photo or file to this message"><svg viewBox="0 0 24 24"><path d="M21 11.5 12.6 19.9a5.3 5.3 0 0 1-7.5-7.5l8.4-8.4a3.5 3.5 0 0 1 5 5l-8.4 8.4a1.8 1.8 0 0 1-2.5-2.5l7.7-7.7"/></svg><i id="attachCount" class="arc-count"></i><small id="attachLabel">Attach</small></button>
    </div>

    <!-- Dock -->
    <div id="dock" class="dock">
      <div id="dotsL" class="desk-dots left"></div>
      <div id="orbWrap" class="orb-wrap">
        <div class="orb-halo"></div>
        <div class="orb-ring"></div>
        <div class="orb-shock"></div>
        <div id="moons" class="moons"></div>
        <canvas id="orb" class="orb" width="220" height="220" aria-label="Wizard orb. Tap to talk, hold for a command and slide sideways to aim it at a desk, swipe up for apps, down for inbox, sideways for desks." role="button" tabindex="0"></canvas>
        <img id="orbFallback" class="orb-fallback" src="robert-thread-orb.png" alt="" hidden>
        <span id="timer" class="timer">0:00</span>
        <span id="holdHint" class="hold-hint">Command</span>
        <span id="orbBadge" class="orb-badge" hidden></span>
      </div>
      <div id="dotsR" class="desk-dots right"></div>
    </div>

    <!-- Launcher (swipe up) -->
    <section id="launcher" class="sheet launcher" aria-label="Apps and views">
      <div class="sheet-grip"></div>
      <div id="launcherBody" class="launcher-body"></div>
      <form id="searchForm" class="search" autocomplete="off">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search, or type a command" enterkeyhint="go" spellcheck="false">
      </form>
    </section>

    <!-- Inbox (swipe down) -->
    <section id="inbox" class="sheet inbox" aria-label="Inbox">
      <div id="inboxBody" class="inbox-body"></div>
      <div class="sheet-grip"></div>
    </section>

    <!-- Settings (gear, top-right of Home and empty desks) -->
    <section id="settings" class="sheet settings" aria-label="Settings">
      <div class="sheet-grip"></div>
      <button class="st-close" data-stclose aria-label="Close settings">✕</button>
      <div id="settingsBody" class="settings-body"></div>
    </section>

    <div id="wmenu" class="wmenu" role="menu"></div>

    <div id="scrim" class="scrim"></div>

    <div id="coach" class="coach" hidden>
      <div class="coach-card">
        <div class="coach-orb"></div>
        <span class="c c-up">↑<b>Apps &amp; views</b></span>
        <span class="c c-down">↓<b>Inbox</b></span>
        <span class="c c-left">←<b>Desk</b></span>
        <span class="c c-right"><b>Desk</b>→</span>
        <p><b>Tap</b> the orb to talk · <b>Hold</b> for a command<br><b>Swipe</b> it ↑ apps · ↓ inbox · ← → desks<br><b>Tap a dot</b> to jump desks · <b>Pinch</b> a window to fill</p>
        <button id="coachGo" class="coach-go">Enter</button>
      </div>
    </div>
  </div>

  <script src="core/core.js"></script>
  <script src="core/config.js"></script>
  <script src="core/status.js"></script>
  <script src="core/apps.js"></script>
  <script src="data.js"></script>
  <script src="summaries.js"></script>
  <script src="live.js"></script>
  <script src="outbox.js"></script>
  <script src="core/chat-kit.js"></script>
  <script src="core/chat-models.js"></script>
  <script src="core/chat-work.js"></script>
  <script src="core/chat-errors.js"></script>
  <script src="core/files.js"></script>
  <script src="core/usage.js"></script>
  <script src="core/chat-power.js"></script>
  <script src="core/chat-search.js"></script>
  <script src="core/chats.js"></script>
  <script src="core/deeplink.js"></script>
  <script src="core/voice-status.js"></script>
  <script src="core/links.js"></script>
  <script src="core/bridge.js"></script>
  <script src="core/android-relay.js"></script>
  <script src="orb.js"></script>
  <script src="app.js"></script>
  <script src="device.js"></script>
  <script src="motion/wizard-motion.js"></script>
  <script src="live-mode.js"></script>
</body>
</html>
