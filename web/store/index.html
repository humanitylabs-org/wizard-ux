<!doctype html>
<html lang="en" data-skin="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07040f">
<title>App Store</title>
<link rel="stylesheet" href="../core/base.css">
<link rel="stylesheet" href="store.css">
<script defer src="store.js"></script>
</head>
<body>
<main id="app" class="store">
  <header class="top">
    <div class="top-row">
      <h1>App Store</h1>
      <span id="preview" class="pv" hidden>Preview</span>
    </div>
    <div class="search-row">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        <input id="q" type="search" placeholder="Apps, agent apps, connections" aria-label="Search the App Store" autocomplete="off" spellcheck="false" enterkeyhint="search">
      </label>
    </div>
  </header>

  <!-- Wizard App Manager by Miguel & Oscar; GPL-3.0, see LICENSE and docs/app-store-window.md. -->
  <section id="discover" aria-label="Browse">
    <nav class="kinds" id="kinds" aria-label="Browse by type"></nav>
    <p id="browse-status" class="browse-status" role="status" hidden></p>
  </section>

  <section id="results" class="layer" hidden aria-live="polite"></section>
  <article id="detail" class="layer" hidden aria-label="App details"></article>
  <div id="toast" class="toast" role="status" hidden></div>
</main>
</body>
</html>
